[Rainmeter]
Update=#MetricsInterval#
AccurateText=1
DynamicWindowSize=1
Group=Parallax|ParallaxCPU
OnRefreshAction=[!CommandMeasure MeasureCPUInfo "Run"]
MouseActionCursor=0
MouseOverAction=[!HideMeter MeterTotal][!ShowMeter MeterOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterOptions][!ShowMeter MeterTotal][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit CPU options
ContextAction2=["notepad.exe" "#@#User\CPU.inc"]
ContextTitle3=CPU settings
ContextAction3=[!ActivateConfig "Parallax\CPU\Settings" "Settings.ini"]

[Metadata]
Name=Parallax CPU
Author=Parallax
Information=Native CPU usage, logical processors, top processes and history, with optional HWiNFO voltage and temperature exports.
Version=0.1.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\CPU.inc
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\CPU\Measures.inc
CPUCoreColumnWidth=(#ContentWidth#-116*#Scale#)

[CPUStyleRowLabel]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#TextColor#
AntiAlias=1
ClipString=1
X=#ContentX#
W=(36*#Scale#)
H=(16*#Scale#)
Hidden=1

[CPUStyleRowValue]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Right
X=(#ContentX#+#ContentWidth#)
W=(52*#Scale#)
H=(16*#Scale#)
NumOfDecimals=0
Text=%1%
Hidden=1

[CPUStyleRowBar]
X=(#ContentX#+40*#Scale#)
W=(#CPUCoreColumnWidth#-44*#Scale#)
H=(2*#Scale#)
BarOrientation=Horizontal
BarColor=#CPUColor#
SolidColor=#TrackColor#
Hidden=1

[CPUStyleRowSensor]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Center
W=(32*#Scale#)
H=(16*#Scale#)
Text=-
Hidden=1
ToolTipText=Optional HWiNFO CPU-wide voltage and package temperature. A dash means unavailable, not measured zero.

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterIcon]
Meter=Shape
X=#ContentX#
Y=(#Inset#+8*#Scale#)
W=(14*#Scale#)
H=(14*#Scale#)
; Original chip silhouette, drawn with simple shapes rather than an imported icon.
Shape=Rectangle (3*#Scale#),(2*#Scale#),(8*#Scale#),(10*#Scale#),#Scale# | Fill Color #CPUColor# | StrokeWidth 0
Shape2=Rectangle (5*#Scale#),(4*#Scale#),(4*#Scale#),(6*#Scale#) | Fill Color #BackgroundColor# | StrokeWidth 0
Shape3=Line 0,(4*#Scale#),(3*#Scale#),(4*#Scale#) | Stroke Color #CPUColor# | StrokeWidth #Scale#
Shape4=Line 0,(7*#Scale#),(3*#Scale#),(7*#Scale#) | Stroke Color #CPUColor# | StrokeWidth #Scale#
Shape5=Line 0,(10*#Scale#),(3*#Scale#),(10*#Scale#) | Stroke Color #CPUColor# | StrokeWidth #Scale#
Shape6=Line (11*#Scale#),(4*#Scale#),(14*#Scale#),(4*#Scale#) | Stroke Color #CPUColor# | StrokeWidth #Scale#
Shape7=Line (11*#Scale#),(7*#Scale#),(14*#Scale#),(7*#Scale#) | Stroke Color #CPUColor# | StrokeWidth #Scale#
Shape8=Line (11*#Scale#),(10*#Scale#),(14*#Scale#),(10*#Scale#) | Stroke Color #CPUColor# | StrokeWidth #Scale#
UpdateDivider=-1

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=(#ContentX#+18*#Scale#)
Y=(#Inset#+6*#Scale#)
W=(#ContentWidth#-82*#Scale#)
H=(20*#Scale#)
Text=CPU Meter
ToolTipText=Native CPU usage. LP labels identify logical processors, including hardware threads.

[MeterProcessorPanel]
Meter=Shape
X=#ContentX#
Y=(#Inset#+26*#Scale#)
W=#ContentWidth#
H=(34*#Scale#)
Shape=Rectangle 0.5,0.5,(#ContentWidth#-1),(34*#Scale#-1),(2*#Scale#) | Fill Color #GraphBackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1
UpdateDivider=-1
Hidden=1
Group=CPUInfo|CPUUI

[MeterProcessorName]
Meter=String
MeterStyle=StyleLabel
X=(#ContentX#+4*#Scale#)
Y=(#Inset#+41*#Scale#)
W=(#ContentWidth#-8*#Scale#)
H=(16*#Scale#)
FontColor=#TextColor#
Text=Checking...
Group=CPUInfo|CPUUI
Hidden=1
FontSize=(#FontSize#*#Scale#)

[MeterProcessorDetails]
Meter=String
MeterStyle=StyleLabel
X=(#ContentX#+4*#Scale#)
Y=(#Inset#+56*#Scale#)
W=(#ContentWidth#-8*#Scale#)
H=(16*#Scale#)
FontSize=(#FontSize#*#Scale#)
Text=Checking...
ToolTipText=Physical cores (hardware threads) @ base clock. Metadata is read once when CPU Meter loads.
Group=CPUInfo|CPUUI
Hidden=1

[MeterProcessorClock]
Meter=String
MeterStyle=StyleLabel
X=(#ContentX#+4*#Scale#)
Y=(#Inset#+64*#Scale#)
W=(#ContentWidth#-8*#Scale#)
H=(16*#Scale#)
FontSize=(#FontSize#*#Scale#)
Text=Checking...
Group=CPUInfo|CPUUI
Hidden=1

[MeterOptions]
Meter=Shape
X=(#ContentX#+#ContentWidth#-18*#Scale#)
Y=(#Inset#+6*#Scale#)
W=(18*#Scale#)
H=(18*#Scale#)
; Original eight-tooth gear; hidden meters have no mouse hit target.
Shape=Path GearPath | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Ellipse (9*#Scale#),(9*#Scale#),(2.5*#Scale#),(2.5*#Scale#) | Fill Color #BackgroundColor# | StrokeWidth 0
GearPath=(9.000*#Scale#),(3.300*#Scale#) | LineTo (10.444*#Scale#),(1.742*#Scale#) | LineTo (11.832*#Scale#),(2.163*#Scale#) | LineTo (12.167*#Scale#),(4.261*#Scale#) | LineTo (13.031*#Scale#),(4.969*#Scale#) | LineTo (15.153*#Scale#),(4.889*#Scale#) | LineTo (15.837*#Scale#),(6.168*#Scale#) | LineTo (14.590*#Scale#),(7.888*#Scale#) | LineTo (14.700*#Scale#),(9.000*#Scale#) | LineTo (16.258*#Scale#),(10.444*#Scale#) | LineTo (15.837*#Scale#),(11.832*#Scale#) | LineTo (13.739*#Scale#),(12.167*#Scale#) | LineTo (13.031*#Scale#),(13.031*#Scale#) | LineTo (13.111*#Scale#),(15.153*#Scale#) | LineTo (11.832*#Scale#),(15.837*#Scale#) | LineTo (10.112*#Scale#),(14.590*#Scale#) | LineTo (9.000*#Scale#),(14.700*#Scale#) | LineTo (7.556*#Scale#),(16.258*#Scale#) | LineTo (6.168*#Scale#),(15.837*#Scale#) | LineTo (5.833*#Scale#),(13.739*#Scale#) | LineTo (4.969*#Scale#),(13.031*#Scale#) | LineTo (2.847*#Scale#),(13.111*#Scale#) | LineTo (2.163*#Scale#),(11.832*#Scale#) | LineTo (3.410*#Scale#),(10.112*#Scale#) | LineTo (3.300*#Scale#),(9.000*#Scale#) | LineTo (1.742*#Scale#),(7.556*#Scale#) | LineTo (2.163*#Scale#),(6.168*#Scale#) | LineTo (4.261*#Scale#),(5.833*#Scale#) | LineTo (4.969*#Scale#),(4.969*#Scale#) | LineTo (4.889*#Scale#),(2.847*#Scale#) | LineTo (6.168*#Scale#),(2.163*#Scale#) | LineTo (7.888*#Scale#),(3.410*#Scale#) | ClosePath 1
Hidden=1
UpdateDivider=-1
MouseActionCursor=1
LeftMouseUpAction=[!ActivateConfig "Parallax\CPU\Settings" "Settings.ini"]
ToolTipText=Open the CPU Settings utility. Changes apply and save immediately.

[MeterTotal]
Meter=String
MeterStyle=StyleTitle
X=(#ContentX#+#ContentWidth#)
Y=(#Inset#+6*#Scale#)
W=(60*#Scale#)
H=(18*#Scale#)
StringAlign=Right
Text=...
Hidden=0
Group=CPUUI
ToolTipText=Overall usage from Rainmeter Processor=0. The first sample after refresh is discarded.
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#

[MeterHistoryLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+268*#Scale#)
H=(16*#Scale#)
FontSize=(#FontSize#*#Scale#)
Text=History warming up
Group=CPUUI
Hidden=1

[MeterHistoryTrack]
Meter=Shape
X=#ContentX#
Y=(#Inset#+282*#Scale#)
W=#ContentWidth#
H=(46*#Scale#)
Shape=Rectangle 0.5,0.5,(#ContentWidth#-1),(46*#Scale#-1) | Fill Color #GraphBackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1
Shape2=Line 1,(11.5*#Scale#),(#ContentWidth#-1),(11.5*#Scale#) | Stroke Color #GridColor# | StrokeWidth 1
Shape3=Line 1,(23*#Scale#),(#ContentWidth#-1),(23*#Scale#) | Stroke Color #GridColor# | StrokeWidth 1
Shape4=Line 1,(34.5*#Scale#),(#ContentWidth#-1),(34.5*#Scale#) | Stroke Color #GridColor# | StrokeWidth 1
Group=CPUHistory
Hidden=1

[MeterHistory]
Meter=Shape
X=#ContentX#
Y=(#Inset#+282*#Scale#)
W=#ContentWidth#
H=(46*#Scale#)
; No initial zero-filled trace. Lua draws only observed interval samples.
Shape=Line 0,0,0,0 | StrokeWidth 0
HistoryPath=0,0
Hidden=1
Group=CPUHistory|CPUUI
ToolTipText=Usage from 0 to 100 percent, newest at right. Only collected samples are drawn. Refresh clears history.

[MeterCoreState]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+122*#Scale#)
H=(28*#Scale#)
FontSize=(#FontSize#*#Scale#)
Text=Detecting logical CPUs...
ToolTipText=Native logical processor display. Use the gear to open CPU Settings.
Group=CPUUI
Hidden=1

[MeterPrevious]
Meter=String
MeterStyle=StyleButton
X=#ContentX#
Y=(#Inset#+250*#Scale#)
W=(28*#Scale#)
H=(16*#Scale#)
Padding=0,0,0,0
SolidColor=0,0,0,0
StringAlign=Left
Text=Prev
FontSize=(#FontSize#*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureCPUController "Page(-1)"]
ToolTipText=Show the previous logical processor page and save the selection.
Hidden=1
Group=CPUUI

[MeterPage]
Meter=String
MeterStyle=StyleLabel
X=(#ContentX#+32*#Scale#)
Y=(#Inset#+250*#Scale#)
W=(#ContentWidth#-64*#Scale#)
H=(16*#Scale#)
StringAlign=Left
FontSize=(#FontSize#*#Scale#)
Text=
Group=CPUUI
Hidden=1

[MeterNext]
Meter=String
MeterStyle=StyleButton
X=(#ContentX#+#ContentWidth#-28*#Scale#)
Y=(#Inset#+250*#Scale#)
W=(28*#Scale#)
H=(16*#Scale#)
Padding=0,0,0,0
SolidColor=0,0,0,0
Text=Next
FontSize=(#FontSize#*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureCPUController "Page(1)"]
ToolTipText=Show the next logical processor page and save the selection.
Hidden=1
Group=CPUUI

[MeterSensors]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+332*#Scale#)
H=(16*#Scale#)
FontSize=(#FontSize#*#Scale#)
Text=HWiNFO: connecting...
ToolTipText=Enable CPU voltage and package temperature exports in HWiNFO Gadget reporting, then reconnect in CPU Settings.
Hidden=1
Group=CPUUI

[CPUCoreMeterInclude]
@Include7=#@#Modules\CPU\CoreMeters.inc

[CPUProcessMeterInclude]
@Include8=#@#Modules\CPU\ProcessMeters.inc
