[Rainmeter]
Update=#CPUUpdateInterval#
AccurateText=1
DynamicWindowSize=1
Group=Parallax|ParallaxCPU
OnRefreshAction=[!CommandMeasure MeasureCPUInfo "Run"][!CommandMeasure MeasureCPUSensors "Reconnect()"]
MouseActionCursor=0
MouseOverAction=[!HideMeter MeterTotal][!ShowMeter MeterOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterOptions][!ShowMeter MeterTotal][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit CPU options
ContextAction2=["notepad.exe" "#@#User\CPU.inc"]
ContextTitle3=CPU settings
ContextAction3=[!ActivateConfig "Parallax\CPU\Settings" "Settings.ini"]

[Metadata]
Name=Parallax CPU
Author=Parallax
Information=Native CPU usage, logical processors, top processes and history, with optional HWiNFO clock, voltage and temperature exports.
Version=0.1.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\CPU.inc
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\CPU\Measures.inc
CPUCoreColumnWidth=(#ContentWidth#-128*#Scale#)
CPUProcessUsageWidth=(42*#Scale#)

[CPUStyleRowLabel]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#TextColor#
AntiAlias=1
ClipString=1
X=#ContentX#
W=(20*#Scale#)
H=(16*#Scale#)
Hidden=1

[CPUStyleRowValue]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Center
X=(#ContentX#+#ContentWidth#-#CPUProcessUsageWidth#/2)
W=#CPUProcessUsageWidth#
H=(16*#Scale#)
NumOfDecimals=0
Text=%1%
Hidden=1

[CPUStyleTableUsageValue]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Center
 ; Keep an 8-logical-pixel visual gutter after the right-aligned temperature.
 ; Center utilization within its field so it shares the Gauge header's centerline.
 X=(#ContentX#+#CPUCoreColumnWidth#+107*#Scale#)
 W=(42*#Scale#)
H=(16*#Scale#)
NumOfDecimals=0
Text=%1%
Hidden=1

[CPUStyleRowBar]
X=(#ContentX#+24*#Scale#)
W=(#CPUCoreColumnWidth#-28*#Scale#)
H=#DataBarThicknessPx#
BarOrientation=Horizontal
BarColor=#CPUColor#
SolidColor=#TrackColor#
Hidden=1

[CPUStyleRowSensor]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Center
W=(44*#Scale#)
H=(16*#Scale#)
Text=-
Hidden=1
ToolTipText=Per-core HWiNFO reading shared by paired hardware threads. A dash means unavailable, not measured zero.

[CPUStyleRowTemperature]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Right
W=(34*#Scale#)
H=(16*#Scale#)
Text=-
Hidden=1
ToolTipText=Per-core HWiNFO reading shared by paired hardware threads. A dash means unavailable, not measured zero.

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterIcon]
Meter=Image
X=#ContentX#
Y=(#TitleRowCenterY#-#TitleIconSize#/2)
W=#TitleIconSize#
H=#TitleIconSize#
; User-provided Lucide CPU artwork, exported from Icons/cpu.svg at 128 px.
ImageName=#@#Modules\CPU\Icons\cpu.png
Greyscale=1
ImageTint=#CPUColor#,255
UpdateDivider=-1

[MeterTitle]
Meter=String
MeterStyle=StyleTitle|StyleTitleRow
X=(#ContentX#+#TitleIconSize#+#TitleIconGap#)
W=(#ContentWidth#-#TitleIconSize#-#TitleIconGap#-64*#Scale#)
Text=CPU Meter
ToolTipText=Native CPU usage. Thread numbers identify Windows logical processors; V/T show paired per-core sensor readings; Current clock is CPU-wide HWiNFO data.

[MeterProcessorPanel]
Meter=Shape
X=#ContentX#
Y=(#Inset#+26*#Scale#)
W=#ContentWidth#
H=(34*#Scale#)
Shape=Rectangle 0.5,0.5,(#ContentWidth#-1),(34*#Scale#-1),(2*#Scale#) | Fill Color #GraphBackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1
UpdateDivider=-1
Hidden=1
Group=CPUInfo|CPUUI

[MeterProcessorName]
Meter=String
MeterStyle=StyleLabel
X=(#ContentX#+4*#Scale#)
Y=(#Inset#+41*#Scale#)
W=(#ContentWidth#-8*#Scale#)
H=(16*#Scale#)
FontColor=#TextColor#
Text=Checking...
Group=CPUInfo|CPUUI
Hidden=1
FontSize=(#FontSize#*#Scale#)

[MeterProcessorDetails]
Meter=String
MeterStyle=StyleLabel
X=(#ContentX#+4*#Scale#)
Y=(#Inset#+56*#Scale#)
W=(#ContentWidth#-8*#Scale#)
H=(16*#Scale#)
FontSize=(#FontSize#*#Scale#)
FontColor=#AccentColor#
Text=Checking...
ToolTipText=Physical cores (hardware threads) @ base clock, with an optional configured turbo boost limit. Metadata is read once when CPU Meter loads.
Group=CPUInfo|CPUUI
Hidden=1

[MeterCurrentClockLabel]
Meter=String
MeterStyle=StyleLabel
X=#ContentX#
Y=(#Inset#+72*#Scale#)
W=(#ContentWidth#-88*#Scale#)
H=(16*#Scale#)
FontSize=(#FontSize#*#Scale#)
Text=Clock:
ToolTipText=Current HWiNFO CPU-wide Core Clocks reading. It is not the base clock or a per-thread measurement.
Group=CPUInfo|CPUClock|CPUUI
Hidden=1

[MeterCurrentClockValue]
Meter=String
MeterStyle=StyleValue
X=(#ContentX#+#ContentWidth#-84*#Scale#)
Y=(#Inset#+72*#Scale#)
W=(84*#Scale#)
H=(16*#Scale#)
StringAlign=Right
FontSize=(#FontSize#*#Scale#)
FontColor=#AccentColor2#
Text=Unavailable
ToolTipText=Enable the CPU [#0] Core Clocks HWiNFO Gadget export to show a current CPU-wide clock.
Group=CPUInfo|CPUClock|CPUUI
Hidden=1

[MeterOptions]
Meter=Shape
X=(#ContentX#+#ContentWidth#-18*#Scale#)
Y=(#TitleRowCenterY#-9*#Scale#)
W=(18*#Scale#)
H=(18*#Scale#)
; Original eight-tooth gear; hidden meters have no mouse hit target.
Shape=Path GearPath | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Ellipse (9*#Scale#),(9*#Scale#),(2.5*#Scale#),(2.5*#Scale#) | Fill Color #BackgroundColor# | StrokeWidth 0
GearPath=(9.000*#Scale#),(3.300*#Scale#) | LineTo (10.444*#Scale#),(1.742*#Scale#) | LineTo (11.832*#Scale#),(2.163*#Scale#) | LineTo (12.167*#Scale#),(4.261*#Scale#) | LineTo (13.031*#Scale#),(4.969*#Scale#) | LineTo (15.153*#Scale#),(4.889*#Scale#) | LineTo (15.837*#Scale#),(6.168*#Scale#) | LineTo (14.590*#Scale#),(7.888*#Scale#) | LineTo (14.700*#Scale#),(9.000*#Scale#) | LineTo (16.258*#Scale#),(10.444*#Scale#) | LineTo (15.837*#Scale#),(11.832*#Scale#) | LineTo (13.739*#Scale#),(12.167*#Scale#) | LineTo (13.031*#Scale#),(13.031*#Scale#) | LineTo (13.111*#Scale#),(15.153*#Scale#) | LineTo (11.832*#Scale#),(15.837*#Scale#) | LineTo (10.112*#Scale#),(14.590*#Scale#) | LineTo (9.000*#Scale#),(14.700*#Scale#) | LineTo (7.556*#Scale#),(16.258*#Scale#) | LineTo (6.168*#Scale#),(15.837*#Scale#) | LineTo (5.833*#Scale#),(13.739*#Scale#) | LineTo (4.969*#Scale#),(13.031*#Scale#) | LineTo (2.847*#Scale#),(13.111*#Scale#) | LineTo (2.163*#Scale#),(11.832*#Scale#) | LineTo (3.410*#Scale#),(10.112*#Scale#) | LineTo (3.300*#Scale#),(9.000*#Scale#) | LineTo (1.742*#Scale#),(7.556*#Scale#) | LineTo (2.163*#Scale#),(6.168*#Scale#) | LineTo (4.261*#Scale#),(5.833*#Scale#) | LineTo (4.969*#Scale#),(4.969*#Scale#) | LineTo (4.889*#Scale#),(2.847*#Scale#) | LineTo (6.168*#Scale#),(2.163*#Scale#) | LineTo (7.888*#Scale#),(3.410*#Scale#) | ClosePath 1
Hidden=1
UpdateDivider=-1
MouseActionCursor=1
LeftMouseUpAction=[!ActivateConfig "Parallax\CPU\Settings" "Settings.ini"]
ToolTipText=Open the CPU Settings utility. Changes apply and save immediately.

[MeterTotal]
Meter=String
MeterStyle=StyleTitle|StyleTitleRow
X=(#ContentX#+#ContentWidth#)
W=(60*#Scale#)
StringAlign=RightCenter
Text=...
Hidden=0
Group=CPUUI
ToolTipText=Overall usage from Rainmeter Processor=0. The first sample after refresh is discarded.
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#

[MeterHistoryTrack]
Meter=Shape
X=#ContentX#
Y=(#Inset#+282*#Scale#)
W=#ContentWidth#
H=(62*#Scale#)
Shape=Rectangle 0.5,0.5,(#ContentWidth#-1),(62*#Scale#-1) | Fill Color #GraphBackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1
Shape2=Line 1,(15.5*#Scale#),(#ContentWidth#-1),(15.5*#Scale#) | Stroke Color #GridColor# | StrokeWidth 1
Shape3=Line 1,(31*#Scale#),(#ContentWidth#-1),(31*#Scale#) | Stroke Color #GridColor# | StrokeWidth 1
Shape4=Line 1,(46.5*#Scale#),(#ContentWidth#-1),(46.5*#Scale#) | Stroke Color #GridColor# | StrokeWidth 1
Group=CPUHistory|CPUUI
Hidden=1
DynamicVariables=1

[MeterHistory]
Meter=Shape
X=#ContentX#
Y=(#Inset#+282*#Scale#)
W=#ContentWidth#
H=(62*#Scale#)
; No initial zero-filled trace. Lua draws only observed total or per-thread samples.
Shape=Line 0,0,0,0 | StrokeWidth 0
HistoryPath=0,0
Hidden=1
Group=CPUHistory|CPUUI
DynamicVariables=1
ToolTipText=Only collected total-CPU or per-thread samples are drawn. Refresh clears history.

[MeterCoreState]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+122*#Scale#)
H=(28*#Scale#)
FontSize=(#FontSize#*#Scale#)
Text=Detecting logical CPUs...
ToolTipText=Native logical processor display. Use the gear to open CPU Settings.
Group=CPUUI
Hidden=1

[MeterPrevious]
Meter=String
MeterStyle=StyleButton
X=#ContentX#
Y=(#Inset#+250*#Scale#)
W=(28*#Scale#)
H=(16*#Scale#)
Padding=0,0,0,0
SolidColor=0,0,0,0
StringAlign=Left
Text=Prev
FontSize=(#FontSize#*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureCPUController "Page(-1)"]
ToolTipText=Show the previous logical processor page and save the selection.
Hidden=1
Group=CPUUI

[MeterPage]
Meter=String
MeterStyle=StyleLabel
X=(#ContentX#+32*#Scale#)
Y=(#Inset#+250*#Scale#)
W=(#ContentWidth#-64*#Scale#)
H=(16*#Scale#)
StringAlign=Left
FontSize=(#FontSize#*#Scale#)
Text=
Group=CPUUI
Hidden=1

[MeterNext]
Meter=String
MeterStyle=StyleButton
X=(#ContentX#+#ContentWidth#-28*#Scale#)
Y=(#Inset#+250*#Scale#)
W=(28*#Scale#)
H=(16*#Scale#)
Padding=0,0,0,0
SolidColor=0,0,0,0
Text=Next
FontSize=(#FontSize#*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureCPUController "Page(1)"]
ToolTipText=Show the next logical processor page and save the selection.
Hidden=1
Group=CPUUI

[MeterSensors]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+332*#Scale#)
H=(16*#Scale#)
FontSize=(#FontSize#*#Scale#)
Text=HWiNFO: connecting...
ToolTipText=Enable per-core temperatures and Core VID exports in HWiNFO Gadget reporting, then reconnect in CPU Settings.
Hidden=1
Group=CPUUI

[CPUCoreMeterInclude]
@Include7=#@#Modules\CPU\CoreMeters.inc

[CPUProcessMeterInclude]
@Include8=#@#Modules\CPU\ProcessMeters.inc
