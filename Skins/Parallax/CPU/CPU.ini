[Rainmeter]
Update=#CPUUpdateInterval#
AccurateText=1
DynamicWindowSize=1
Group=Parallax|ParallaxCPU
; #ParallaxIdleJoinAction# is empty unless Global Settings Idle pause is on
; (@Resources\Idle\Hook<n>.inc).
OnRefreshAction=[!CommandMeasure MeasureCPUInfo "Run"][!CommandMeasure MeasureCPUSensors "Reconnect()"]#ParallaxIdleJoinAction#
MouseActionCursor=0
MouseOverAction=[!HideMeter MeterTotal][!ShowMeter MeterOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterOptions][!ShowMeter MeterTotal]#ParallaxIdleHoverAction#[!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit CPU options
ContextAction2=["notepad.exe" "#@#User\CPU.inc"]
ContextTitle3=CPU settings
ContextAction3=[!ActivateConfig "Parallax\CPU\Settings" "Settings.ini"]

[Metadata]
Name=Parallax CPU
Author=Parallax
Information=Windows CPU busy time (% Processor Time) for the total and each logical processor, top processes and history, with optional HWiNFO clock, fan, voltage and temperature exports.
Version=0.1.0

[Variables]
; Fallback before the user include: it also names the process-measure include
; (Measures.inc), so an older CPU.inc without the key keeps today's list.
CPUShowProcesses=1
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\CPU.inc
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\CPU\Measures.inc
; Idle stand-down (Global Settings Idle pause; @Resources\Idle\Hook.inc, last
; section). CPU.lua re-applies the 64 Thread slot dividers and restarts the
; History on resume; Sensors.lua re-arms a pending discovery. While paused
; the title and the headline total are hidden and "Paused (idle)" takes the
; title's place, left of the gear slot; the gear still follows the hover
; (#ParallaxIdleHoverAction# keeps the frozen total hidden on a hover-out).
ParallaxIdleControllers=MeasureCPUController|MeasureCPUSensors
ParallaxIdleHeadline=MeterTitle|MeterTotal
ParallaxIdleHoverSwap=MeterOptions|MeterTotal
ParallaxIdleHookDivider=(Max(1,Round(#ParallaxIdleHookMs#/#CPUUpdateInterval#)))
ParallaxPausedX=(#ContentX#+#TitleIconSize#+#TitleIconGap#)
ParallaxPausedY=#TitleRowCenterY#
ParallaxPausedW=(#ContentWidth#-#TitleIconSize#-2*#TitleIconGap#-18*#Scale#)
ParallaxPausedH=#TitleRowHeight#
ParallaxPausedAlign=LeftCenter
; V 44 + T 34 + gutter 8 + busy-time field 50 logical pixels follow the Thread column.
CPUCoreColumnWidth=(#ContentWidth#-136*#Scale#)
; Process percentages share the Thread table's 50-pixel field and Gauge centerline.
CPUProcessUsageWidth=(50*#Scale#)

[CPUStyleRowLabel]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#TextColor#
AntiAlias=1
ClipString=1
X=#ContentX#
W=(20*#Scale#)
H=(16*#Scale#)
Hidden=1

[CPUStyleRowValue]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Center
X=(#ContentX#+#ContentWidth#-#CPUProcessUsageWidth#/2)
W=#CPUProcessUsageWidth#
H=(16*#Scale#)
NumOfDecimals=0
Text=%1%
Hidden=1

[CPUStyleTableUsageValue]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Center
 ; Keep an 8-logical-pixel visual gutter after the right-aligned temperature.
 ; Center the busy-time value within its field so it shares the Gauge header's centerline.
 ; 50 px holds "100.0%" in IBM Plex Sans Medium at the 10 pt body maximum (48.5 px).
 X=(#ContentX#+#CPUCoreColumnWidth#+111*#Scale#)
 W=(50*#Scale#)
H=(16*#Scale#)
NumOfDecimals=0
Text=%1%
Hidden=1

[CPUStyleRowBar]
X=(#ContentX#+24*#Scale#)
W=(#CPUCoreColumnWidth#-28*#Scale#)
H=#DataBarThicknessPx#
BarOrientation=Horizontal
BarColor=#CPUColor#
SolidColor=#TrackColor#
Hidden=1

[CPUStyleRowSensor]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Center
W=(44*#Scale#)
H=(16*#Scale#)
Text=-
Hidden=1

[CPUStyleRowTemperature]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
ClipString=1
StringAlign=Right
W=(34*#Scale#)
H=(16*#Scale#)
Text=-
Hidden=1

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterIcon]
Meter=Image
X=#ContentX#
Y=(#TitleRowCenterY#-#TitleIconSize#/2)
W=#TitleIconSize#
H=#TitleIconSize#
