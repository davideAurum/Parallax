; No DynamicVariables on either history meter: CPU.lua changes them only with
; !SetOption, which re-reads the meter once, and layout() forces the frame.
Shape=Line 0,0,0,0 | StrokeWidth 0
HistoryPath=0,0
Hidden=1
Group=CPUHistory|CPUUI|ParallaxIdleFreeze

