[CPUCoreMeterInclude]
@Include7=#@#Modules\CPU\CoreMeters.inc

[CPUProcessMeterInclude]
@Include8=#@#Modules\CPU\ProcessMeters.inc

; Idle stand-down hook, last so its "Paused (idle)" line draws on top. Off
; (IdlePauseMinutes=0) loads a comment-only file (@Resources\Idle\Hook0.inc).
[ParallaxIdleHookInclude]
@Include99=#@#Idle\Hook#IdlePauseMinutes#.inc
