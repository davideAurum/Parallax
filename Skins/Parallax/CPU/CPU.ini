Shape2=Line 1,(15.5*#Scale#),(#ContentWidth#-1),(15.5*#Scale#) | Stroke Color #GridColor# | StrokeWidth 1
Shape3=Line 1,(31*#Scale#),(#ContentWidth#-1),(31*#Scale#) | Stroke Color #GridColor# | StrokeWidth 1
