[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit CPU options
ContextAction2=["notepad.exe" "#@#User\CPU.inc"]

[Metadata]
Name=Parallax CPU Thread Colors
Author=Parallax
Information=CPU-only thread colors for matching utilization bars and graph traces.
Version=0.1.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\CPU.inc
; This CPU-only editor arranges detected logical threads in two columns.
Columns=2
PanelHeight=100
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc

[MeasureCPUThreadColors]
Measure=Script
ScriptFile=#@#Modules\CPU\ThreadColors.lua

[MeasureCPUThreadColorInput]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Modules\CPU\
Parameter=-NoProfile -NonInteractive
State=Hide
OutputType=UTF8
Timeout=300000
FinishAction=[!UpdateMeasure MeasureCPUThreadColorInput][!CommandMeasure MeasureCPUThreadColors "CommitInput()"]
UpdateDivider=-1
DynamicVariables=1

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterThreadColorsTitle]
Meter=String
MeterStyle=StyleTitle|StyleTitleRow
X=#ContentX#
W=(#ContentWidth#-28*#Scale#)
Text=Thread Colors
Group=CPUThreadColorsUI

[MeterThreadColorsClose]
Meter=String
MeterStyle=StyleButton
X=(#ContentX#+#ContentWidth#)
Y=(#TitleRowCenterY#-9*#Scale#)
W=(18*#Scale#)
H=(18*#Scale#)
StringAlign=RightCenter
Padding=0,0,0,0
Text=X
LeftMouseUpAction=[!DeactivateConfig]
ToolTipText=Close Thread Colors. Saved choices stay active in CPU Meter.
Group=CPUThreadColorsUI
FontSize=(#FontSize#*#Scale#)

[MeterThreadColorsNote]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+32*#Scale#)
W=#ContentWidth#
FontSize=((#FontSize#-1)*#Scale#)
Text=Each color is shared by its Thread bar and graph trace.
Group=CPUThreadColorsUI

[MeterThreadColorsHint]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+50*#Scale#)
W=#ContentWidth#
FontSize=((#FontSize#-1)*#Scale#)
FontColor=#AccentColor#
Text=Click a hex code or swatch to enter #RRGGBB.
Group=CPUThreadColorsUI

[MeterThreadColorsRule]
Meter=Shape
MeterStyle=StyleTableHeaderRule
Y=(#Inset#+76*#Scale#)
Group=CPUThreadColorsUI

[CPUThreadColorMeterInclude]
@Include6=#@#Modules\CPU\ThreadColorMeters.inc
