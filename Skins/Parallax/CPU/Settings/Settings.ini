[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
OnRefreshAction=[!CommandMeasure MeasureCPUSettings "ScanSensors(false)"]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit CPU options
ContextAction2=["notepad.exe" "#@#User\CPU.inc"]

[Metadata]
Name=Parallax CPU Settings
Author=Parallax
Information=Independent CPU display controls. Changes apply immediately and persist in CPU options.
Version=0.1.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\CPU.inc
; This settings utility has its own layout, independent of the CPU meter's height.
Columns=2
PanelHeight=1000
SettingsUtilityName=CPU
; Settings-only layout defaults; the controller collapses dependent rows before drawing.
CPUSettingsAppearanceSectionY=74
CPUSettingsInfoHidden=0
CPUSettingsInfoY=100
CPUSettingsCoresHidden=0
CPUSettingsCoresY=128
CPUSettingsDecimalsHidden=0
CPUSettingsDecimalsY=156
CPUSettingsVoltageDecimalsHidden=0
CPUSettingsVoltageDecimalsY=184
CPUSettingsTemperatureDecimalsHidden=0
CPUSettingsTemperatureDecimalsY=212
CPUSettingsThreadColorsHidden=0
CPUSettingsThreadColorsY=240
CPUSettingsProcessesSectionY=280
CPUSettingsProcessesHidden=0
CPUSettingsProcessesY=306
CPUSettingsProcessCountHidden=0
CPUSettingsProcessCountY=334
CPUSettingsGraphSectionY=374
CPUSettingsHistoryHidden=0
CPUSettingsHistoryY=400
CPUSettingsSourceHidden=0
CPUSettingsSourceY=428
CPUSettingsSamplesHidden=0
CPUSettingsSamplesY=456
CPUSettingsRatesSectionY=496
CPUSettingsUpdateRateHidden=0
CPUSettingsUpdateRateY=522
CPUSettingsSensorRateHidden=0
CPUSettingsSensorRateY=550
CPUSettingsSensorsSectionY=590
CPUSettingsSensorsHidden=0
CPUSettingsSensorsY=616
CPUSettingsOpenHWiNFOY=644
CPUSettingsGuideY=644
CPUSettingsScanY=644
CPUSettingsSensorGuide1Y=678
CPUSettingsSensorGuide2Y=696
CPUSettingsSensorGuide3Y=714
CPUSettingsSensorGuide4Y=732
CPUSettingsSensorStatusY=750
CPUSettingsSensorDetailY=768
CPUSettingsTemperatureHidden=0
CPUSettingsTemperatureY=810
CPUSettingsVoltageHidden=0
CPUSettingsVoltageY=838
CPUSettingsSensorHiveHidden=0
CPUSettingsSensorHiveY=866
CPUSettingsReconnectHidden=0
CPUSettingsReconnectY=894
CPUSettingsSensorsHintY=930
CPUSettingsHintY=948
CPUSettingsIndependenceY=966
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc

[MeasureCPUSettingsDiscover]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Modules\CPU\
Parameter=-NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File "DiscoverSensors.ps1" -List
State=Hide
OutputType=UTF8
Timeout=10000
UpdateDivider=1
FinishAction=[!UpdateMeasure MeasureCPUSettingsDiscover][!CommandMeasure MeasureCPUSettings "ApplySensorScan()"]

[MeasureCPUSettings]
Measure=Script
ScriptFile=#@#Modules\CPU\Settings.lua

[MeasureCPUSettingsDecimalInput]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Scripts\
Parameter=-NoProfile -NonInteractive
State=Hide
OutputType=UTF8
Timeout=300000
FinishAction=[!UpdateMeasure MeasureCPUSettingsDecimalInput][!CommandMeasure MeasureCPUSettings "CommitNumberInput()"]
UpdateDivider=-1
DynamicVariables=1

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds
DynamicVariables=1

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel
DynamicVariables=1

[CPUSettingsMeterInclude]
@Include6=#@#Modules\CPU\SettingsMeters.inc
@Include7=#@#UtilitySettingsNote.inc
