; Hairline row separators. They are decorative rules, not synthetic progress data.
[MeterRowRules]
Meter=Shape
Hidden=(1-#ChronometerShowTimers#)
X=#ContentX#
Y=(#Inset#+(#ChronometerShowTimers#*(#ChronometerTimersY#+58+#ChronometerHeaderExtra#+3*#ChronometerBodyExtra#+#ChronometerRuleExtra#))*#Scale#)
Shape=Line 0,0,#ContentWidth#,0 | Stroke Color #DividerColor# | StrokeWidth (#DividerThickness#*#Scale#)
Shape2=Line 0,((37+3*#ChronometerBodyExtra#+#ChronometerRuleExtra#)*#Scale#),#ContentWidth#,((37+3*#ChronometerBodyExtra#+#ChronometerRuleExtra#)*#Scale#) | Stroke Color #DividerColor# | StrokeWidth (#DividerThickness#*#Scale#)
Shape3=Line 0,((74+6*#ChronometerBodyExtra#+2*#ChronometerRuleExtra#)*#Scale#),#ContentWidth#,((74+6*#ChronometerBodyExtra#+2*#ChronometerRuleExtra#)*#Scale#) | Stroke Color #DividerColor# | StrokeWidth (#DividerThickness#*#Scale#)
