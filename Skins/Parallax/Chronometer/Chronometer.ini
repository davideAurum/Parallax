[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=Parallax
MouseOverAction=[!ShowMeter MeterChronometerOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterChronometerOptions][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit countdown lists
ContextAction2=["#CONFIGEDITOR#" "#@#User\Chronometer.inc"]
ContextTitle3=Chronometer settings
ContextAction3=[!ActivateConfig "Parallax\Chronometer\Settings" "Settings.ini"]

[Metadata]
Name=Parallax Chronometer
Author=Parallax contributors
Information=Local clock, system uptime, a dated event countdown and three independent lists of four duration timers.
Version=0.1.0
License=See repository license

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#Modules\Chronometer\Defaults.inc
@Include4=#@#User\Chronometer.inc
@Include5=#@#Geometry.inc
@Include6=#@#Modules\Chronometer\Layout.inc
@Include7=#@#Styles.inc
@Include8=#@#Modules\Chronometer\Styles.inc

[MeasureClock]
Measure=Time
Format=#ChronometerClockFormat#

[MeasureDate]
Measure=Time
Format=#ChronometerDateFormat#

[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!02i!:%2!02i!:%1!02i!

[MeasureChronometer]
Measure=Script
ScriptFile=#@#Modules\Chronometer\Chronometer.lua

[MeasureEventCountdown]
Measure=Script
ScriptFile=#@#Modules\Chronometer\Event.lua

; Original native editor, launched only when Add/Edit event is clicked.
[MeasureEventEditor]
Measure=Plugin
Plugin=RunCommand
Program=""#@#Modules\Chronometer\EventEditor.exe""
Parameter=-StatePath "#SETTINGSPATH#Parallax-Chronometer-event-v1.state"
State=Show
OutputType=UTF8
Timeout=-1
FinishAction=[!CommandMeasure MeasureEventCountdown "EditorFinished()"]
IfCondition=MeasureEventEditor >= 100
IfTrueAction=[!CommandMeasure MeasureEventCountdown "EditorFailed()"]

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

; Original clock-face icon drawn from simple Rainmeter shapes.
[MeterIcon]
Meter=Shape
X=#ContentX#
Y=(#Inset#+7*#Scale#)
W=(14*#Scale#)
H=(14*#Scale#)
Shape=Ellipse (7*#Scale#),(7*#Scale#),(5.5*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #ClockColor#
Shape2=Line (7*#Scale#),(3.5*#Scale#),(7*#Scale#),(7*#Scale#) | StrokeWidth (1*#Scale#) | Stroke Color #ClockColor#
Shape3=Line (7*#Scale#),(7*#Scale#),(9.5*#Scale#),(8.5*#Scale#) | StrokeWidth (1*#Scale#) | Stroke Color #ClockColor#
UpdateDivider=-1

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=(#ContentX#+#ContentWidth#/2)
Y=(#Inset#+6*#Scale#)
W=(#ContentWidth#-38*#Scale#)
H=(Ceil((18+#ChronometerTitleExtra#)*#Scale#))
StringAlign=Center
Text=Chronometer

; Original Parallax gear, matching the other utility headers.
[MeterChronometerOptions]
Meter=Shape
X=(#ContentX#+#ContentWidth#-18*#Scale#)
Y=(#Inset#+6*#Scale#)
W=(18*#Scale#)
H=(18*#Scale#)
SolidColor=0,0,0,1
Shape=Path GearPath | Fill Color #AccentColor2# | StrokeWidth 0
Shape2=Ellipse (9*#Scale#),(9*#Scale#),(2.5*#Scale#),(2.5*#Scale#) | Fill Color #BackgroundColor# | StrokeWidth 0
GearPath=(9.000*#Scale#),(3.300*#Scale#) | LineTo (10.444*#Scale#),(1.742*#Scale#) | LineTo (11.832*#Scale#),(2.163*#Scale#) | LineTo (12.167*#Scale#),(4.261*#Scale#) | LineTo (13.031*#Scale#),(4.969*#Scale#) | LineTo (15.153*#Scale#),(4.889*#Scale#) | LineTo (15.837*#Scale#),(6.168*#Scale#) | LineTo (14.590*#Scale#),(7.888*#Scale#) | LineTo (14.700*#Scale#),(9.000*#Scale#) | LineTo (16.258*#Scale#),(10.444*#Scale#) | LineTo (15.837*#Scale#),(11.832*#Scale#) | LineTo (13.739*#Scale#),(12.167*#Scale#) | LineTo (13.031*#Scale#),(13.031*#Scale#) | LineTo (13.111*#Scale#),(15.153*#Scale#) | LineTo (11.832*#Scale#),(15.837*#Scale#) | LineTo (10.112*#Scale#),(14.590*#Scale#) | LineTo (9.000*#Scale#),(14.700*#Scale#) | LineTo (7.556*#Scale#),(16.258*#Scale#) | LineTo (6.168*#Scale#),(15.837*#Scale#) | LineTo (5.833*#Scale#),(13.739*#Scale#) | LineTo (4.969*#Scale#),(13.031*#Scale#) | LineTo (2.847*#Scale#),(13.111*#Scale#) | LineTo (2.163*#Scale#),(11.832*#Scale#) | LineTo (3.410*#Scale#),(10.112*#Scale#) | LineTo (3.300*#Scale#),(9.000*#Scale#) | LineTo (1.742*#Scale#),(7.556*#Scale#) | LineTo (2.163*#Scale#),(6.168*#Scale#) | LineTo (4.261*#Scale#),(5.833*#Scale#) | LineTo (4.969*#Scale#),(4.969*#Scale#) | LineTo (4.889*#Scale#),(2.847*#Scale#) | LineTo (6.168*#Scale#),(2.163*#Scale#) | LineTo (7.888*#Scale#),(3.410*#Scale#) | ClosePath 1
Hidden=1
UpdateDivider=-1
MouseActionCursor=1
ToolTipText=Chronometer settings: Clock/Date, Uptime, Event Countdown and Timers.
LeftMouseUpAction=[!ActivateConfig "Parallax\Chronometer\Settings" "Settings.ini"]

[MeterClock]
Meter=String
Hidden=(1-#ChronometerShowClock#)
MeterStyle=StyleValue
MeasureName=MeasureClock
X=(#ContentX#+#ContentWidth#/2)
Y=(#Inset#+(#ChronometerShowClock#*(#ChronometerClockY#+0))*#Scale#)
W=#ContentWidth#
H=(Ceil((35+#ChronometerBodyExtra#)*#Scale#))
FontSize=((#FontSize#+11)*#Scale#)
FontWeight=600
FontColor=#ClockColor#
StringAlign=Center
Text=%1

[MeterDate]
Meter=String
Hidden=(1-#ChronometerShowClock#)
MeterStyle=StyleLabel
MeasureName=MeasureDate
X=(#ContentX#+#ContentWidth#/2)
Y=(Ceil(#Inset#+(#ChronometerShowClock#*(#ChronometerClockY#+35+#ChronometerBodyExtra#))*#Scale#))
W=#ContentWidth#
H=((16+#ChronometerBodyExtra#+#ChronometerDateExtra#)*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
StringAlign=Center
Text=%1

; This top divider belongs to the section below it.
[MeterUptimeRule]
Meter=Shape
Hidden=(1-#ChronometerShowUptime#)
MeterStyle=StyleRule
Y=(#Inset#+#ChronometerShowUptime#*#ChronometerUptimeY#*#Scale#)

[MeterUptimeLabel]
Meter=String
Hidden=(1-#ChronometerShowUptime#)
MeterStyle=StyleLabel
Y=(#Inset#+(#ChronometerShowUptime#*(#ChronometerUptimeY#+5))*#Scale#)
W=(45*#Scale#)
H=((16+#ChronometerBodyExtra#)*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
Text=Uptime
ToolTipText=System time since the last full Windows restart. Fast Startup shutdowns may preserve uptime.

[MeterUptimeValue]
Meter=String
Hidden=(1-#ChronometerShowUptime#)
MeterStyle=StyleLabel
MeasureName=MeasureUptime
X=(#ContentX#+#ContentWidth#)
Y=(#Inset#+(#ChronometerShowUptime#*(#ChronometerUptimeY#+5))*#Scale#)
W=(#ContentWidth#-51*#Scale#)
H=((16+#ChronometerBodyExtra#)*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
FontColor=#ClockColor#
StringAlign=Right
Text=%1
ToolTipText=System uptime in days and hours:minutes:seconds. Refreshing Chronometer does not reset it.

; This top divider belongs to the section below it.
[MeterEventRule]
Meter=Shape
Hidden=(1-#ChronometerShowEvent#)
MeterStyle=StyleRule
Y=(#Inset#+#ChronometerShowEvent#*#ChronometerEventY#*#Scale#)

[MeterEventName]
Meter=String
Hidden=(1-#ChronometerShowEvent#)
MeterStyle=StyleLabel
Group=ChronometerEvent
X=#ContentX#
Y=(#Inset#+#ChronometerShowEvent#*(#ChronometerEventY#+4)*#Scale#)
W=#ContentWidth#
H=#ChronometerEventLineHeight#
StringAlign=Left
Text=No event set
ToolTipText=Add an event in Chronometer settings.

[MeterEventCountdown]
Meter=String
Hidden=(1-#ChronometerShowEvent#)
MeterStyle=StyleLabel
Group=ChronometerEvent
X=#ContentX#
Y=(#Inset#+#ChronometerShowEvent#*((#ChronometerEventY#+4)*#Scale#+#ChronometerEventLineHeight#))
W=#ContentWidth#
H=#ChronometerEventLineHeight#
FontColor=#ClockColor#
StringAlign=Left
Text=Add in settings
ToolTipText=Add an event in Chronometer settings.

; This top divider belongs to the section below it.
[MeterTimersRule]
Meter=Shape
Hidden=(1-#ChronometerShowTimers#)
MeterStyle=StyleRule
Y=(#Inset#+#ChronometerShowTimers#*#ChronometerTimersY#*#Scale#)

