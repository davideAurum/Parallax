Y=(#Inset#+214*#Scale#)
W=(76*#Scale#)
Text=Shown
ToolTipText=Show or hide the event countdown. Its deadline continues while hidden. Click to toggle.
LeftMouseUpAction=[!CommandMeasure MeasureChronometerSettings "ToggleSection('Event')"]

[MeterEventConfigure]
Meter=String
MeterStyle=StyleButton|ChronometerSettingsButton|ChronometerSettingsCentered|StyleSecondaryButton
X=(#ContentX#+#ContentWidth#/2)
Y=(#Inset#+242*#Scale#)
W=#ContentWidth#
Text=Add / edit event countdown
ToolTipText=Open the event form for a name, date and time. The countdown updates in Chronometer.
LeftMouseUpAction=[!ActivateConfig "Parallax\Chronometer" "Chronometer.ini"][!CommandMeasure MeasureEventCountdown "OpenEditor()" "Parallax\Chronometer"]

[MeterEventSettingsRule]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+260*#Scale#)

[MeterTimersSection]
