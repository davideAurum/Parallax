[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit Chronometer options
ContextAction2=["#CONFIGEDITOR#" "#@#User\Chronometer.inc"]

[Metadata]
Name=Parallax Chronometer Settings
Author=Parallax contributors
Information=Section visibility and controls for Clock/Date, Uptime, Event Countdown and Timers.
Version=0.1.0
License=See repository license

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#Modules\Chronometer\Defaults.inc
@Include4=#@#User\Chronometer.inc
; Settings-local height follows saved visibility; it is never persisted to the monitor.
PanelHeight=(752-84*(1-#ChronometerShowClock#)-28*(1-#ChronometerShowEvent#)-216*(1-#ChronometerShowTimers#))
SettingsUtilityName=Chronometer
@Include5=#@#Geometry.inc
WindowWidth=(2*#Pitch#)
@Include6=#@#Styles.inc

[ChronometerSettingsText]
FontColor=#TextColor#

[ChronometerSettingsData]
Group=ChronometerSettingsData

[ChronometerSettingsButton]
Group=ChronometerSettingsData
Padding=0,0,0,0
H=(24*#Scale#)
SolidColor=#GraphBackgroundColor#
StringAlign=LeftCenter
MouseActionCursor=1

[ChronometerSettingsCentered]
StringAlign=CenterCenter

[MeasureChronometerSettings]
Measure=Script
ScriptFile=#@#Modules\Chronometer\Settings.lua

[MeasureChronometerSettingsInput]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Scripts\
Parameter=-NoProfile -NonInteractive
State=Hide
OutputType=UTF8
Timeout=300000
UpdateDivider=-1
DynamicVariables=1
FinishAction=[!UpdateMeasure MeasureChronometerSettingsInput][!CommandMeasure MeasureChronometerSettings "CommitNumberInput()"]

[MeterBounds]
Meter=Image
DynamicVariables=1
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
DynamicVariables=1
MeterStyle=StylePanel
@Include7=#@#UtilitySettingsNote.inc

[MeterTitle]
Meter=String
DynamicVariables=1
MeterStyle=StyleTitle|StyleTitleRow|ChronometerSettingsText
X=(#ContentX#+#ContentWidth#/2)
W=(#ContentWidth#-44*#Scale#)
StringAlign=CenterCenter
Text=Chronometer settings

[MeterClose]
Meter=String
DynamicVariables=1
MeterStyle=StyleButton|ChronometerSettingsButton|ChronometerSettingsCentered|StyleSecondaryButton|ChronometerSettingsText
X=(#ContentX#+#ContentWidth#-10*#Scale#)
Y=#TitleRowCenterY#
W=(20*#Scale#)
H=(18*#Scale#)
Text=X
ToolTipText=Close settings. Chronometer and its timers keep running.
LeftMouseUpAction=[!DeactivateConfig]

[MeterGeneralSection]
Meter=String
DynamicVariables=1
MeterStyle=StyleUtilitySettingsSection
Y=(#Inset#+74*#Scale#)
Text=Appearance

[MeterGeneralSectionRule]
Meter=Shape
DynamicVariables=1
MeterStyle=StyleRule
Y=(#Inset#+95*#Scale#)

[MeterWidthRow]
Meter=Shape
DynamicVariables=1
MeterStyle=StyleSettingsStepperFrame
Y=(#Inset#+101*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureChronometerSettings "BeginNumberInput('Columns')"]
ToolTipText=Panel width in columns: type 1 or 2. Arrows stop at either limit.
X=(#ContentX#+140*#Scale#)
W=(#ContentWidth#-160*#Scale#)
H=(20*#Scale#)
Shape=Rectangle (#Scale#/2),(#Scale#/2),(#ContentWidth#-161*#Scale#),(19*#Scale#),(2*#Scale#) | Fill Color #GraphBackgroundColor# | Stroke Color #BorderColor# | StrokeWidth #Scale#

[MeterWidthLabel]
Meter=String
DynamicVariables=1
MeterStyle=StyleUtilitySettingsLabel|ChronometerSettingsData|ChronometerSettingsText
Y=(#Inset#+103*#Scale#)
W=(112*#Scale#)
Text=Panel width
