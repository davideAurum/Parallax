MeterStyle=StyleButton|ChronometerSettingsButton|ChronometerSettingsCentered
X=(#ContentX#+#ContentWidth#-38*#Scale#)
Y=(#Inset#+278*#Scale#)
W=(76*#Scale#)
Text=Shown
ToolTipText=Show or hide all duration timers. Running timers continue while hidden. Click to toggle.
LeftMouseUpAction=[!CommandMeasure MeasureChronometerSettings "ToggleSection('Timers')"]

