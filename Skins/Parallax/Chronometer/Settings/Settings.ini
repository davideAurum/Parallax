[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit Chronometer options
ContextAction2=["#CONFIGEDITOR#" "#@#User\Chronometer.inc"]

[Metadata]
Name=Parallax Chronometer Settings
Author=Parallax contributors
Information=Section visibility and controls for Clock/Date, Uptime, Event Countdown and Timers.
Version=0.1.0
License=See repository license

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#Modules\Chronometer\Defaults.inc
@Include4=#@#User\Chronometer.inc
PanelHeight=526
@Include5=#@#Geometry.inc

; Keep the module's Columns value for the width control. This menu always spans two pitches.
WindowWidth=(2*#Pitch#)
@Include6=#@#Styles.inc

[ChronometerSettingsButton]
Group=ChronometerSettingsData
FontColor=#AccentColor#
Padding=0,0,0,0
H=(22*#Scale#)
SolidColor=#GraphBackgroundColor#
StringAlign=LeftCenter
MouseActionCursor=1

[ChronometerSettingsCentered]
StringAlign=CenterCenter

[MeasureChronometerSettings]
Measure=Script
ScriptFile=#@#Modules\Chronometer\Settings.lua

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=(#ContentX#+#ContentWidth#/2)
Y=(#Inset#+6*#Scale#)
W=(#ContentWidth#-44*#Scale#)
H=(24*#Scale#)
StringAlign=Center
Text=Chronometer settings

[MeterClose]
Meter=String
MeterStyle=StyleButton|ChronometerSettingsButton|ChronometerSettingsCentered|StyleSecondaryButton
X=(#ContentX#+#ContentWidth#-10*#Scale#)
Y=(#Inset#+15*#Scale#)
W=(20*#Scale#)
H=(18*#Scale#)
Text=X
ToolTipText=Close settings. Chronometer and its timers keep running.
LeftMouseUpAction=[!DeactivateConfig]

[MeterWidthLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+33*#Scale#)
W=(102*#Scale#)
Text=Panel width

[MeterWidthValue]
Meter=String
MeterStyle=StyleButton|ChronometerSettingsButton
X=(#ContentX#+110*#Scale#)
Y=(#Inset#+41*#Scale#)
W=(#ContentWidth#-110*#Scale#)
Text=Single column
ToolTipText=Switch only Chronometer between single and double width.
LeftMouseUpAction=[!CommandMeasure MeasureChronometerSettings "ToggleColumns()"]

[MeterRule]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+58*#Scale#)

[MeterClockSection]
Meter=String
MeterStyle=StyleHeader
Y=(#Inset#+67*#Scale#)
W=(#ContentWidth#-86*#Scale#)
H=(20*#Scale#)
Text=Clock/Date

[MeterClockVisibility]
Meter=String
MeterStyle=StyleButton|ChronometerSettingsButton|ChronometerSettingsCentered
X=(#ContentX#+#ContentWidth#-38*#Scale#)
Y=(#Inset#+76*#Scale#)
W=(76*#Scale#)
Text=Shown
ToolTipText=Show or hide the clock and date in Chronometer. Click to toggle.
LeftMouseUpAction=[!CommandMeasure MeasureChronometerSettings "ToggleSection('Clock')"]

[MeterClockLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+91*#Scale#)
W=(102*#Scale#)
Text=Clock

[MeterClockValue]
Meter=String
MeterStyle=StyleButton|ChronometerSettingsButton
X=(#ContentX#+110*#Scale#)
Y=(#Inset#+99*#Scale#)
W=(#ContentWidth#-110*#Scale#)
Text=24-hour
ToolTipText=Switch between 24-hour and 12-hour time.
LeftMouseUpAction=[!CommandMeasure MeasureChronometerSettings "CycleClock()"]

[MeterSecondsLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+115*#Scale#)
W=(102*#Scale#)
Text=Seconds

[MeterSecondsValue]
Meter=String
MeterStyle=StyleButton|ChronometerSettingsButton
X=(#ContentX#+110*#Scale#)
Y=(#Inset#+123*#Scale#)
W=(#ContentWidth#-110*#Scale#)
Text=Shown
ToolTipText=Show or hide seconds in the clock.
LeftMouseUpAction=[!CommandMeasure MeasureChronometerSettings "ToggleSeconds()"]

[MeterDateLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+139*#Scale#)
W=(102*#Scale#)
Text=Date

[MeterDateValue]
Meter=String
MeterStyle=StyleButton|ChronometerSettingsButton
X=(#ContentX#+110*#Scale#)
Y=(#Inset#+147*#Scale#)
W=(#ContentWidth#-110*#Scale#)
Text=Full date
ToolTipText=Cycle full, short and ISO date formats.
LeftMouseUpAction=[!CommandMeasure MeasureChronometerSettings "CycleDate()"]

[MeterClockSettingsRule]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+164*#Scale#)

[MeterUptimeSection]
Meter=String
MeterStyle=StyleHeader
Y=(#Inset#+173*#Scale#)
W=(#ContentWidth#-86*#Scale#)
H=(20*#Scale#)
Text=Uptime

[MeterUptimeVisibility]
Meter=String
MeterStyle=StyleButton|ChronometerSettingsButton|ChronometerSettingsCentered
X=(#ContentX#+#ContentWidth#-38*#Scale#)
Y=(#Inset#+182*#Scale#)
W=(76*#Scale#)
Text=Shown
ToolTipText=Show or hide time since the last full Windows restart. Fast Startup may preserve uptime. Click to toggle.
LeftMouseUpAction=[!CommandMeasure MeasureChronometerSettings "ToggleSection('Uptime')"]

[MeterUptimeSettingsRule]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+196*#Scale#)

[MeterEventSection]
Meter=String
MeterStyle=StyleHeader
Y=(#Inset#+205*#Scale#)
W=(#ContentWidth#-86*#Scale#)
H=(20*#Scale#)
Text=Event Countdown

