[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
OnRefreshAction=[!CommandMeasure MeasureColorPicker "Render()"]
ContextTitle=Global settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]

[Metadata]
Name=Global Color Picker
Author=Parallax
Information=Event-driven RGB, HSV and CIELAB D50 picker for allowlisted global colors. Background color changes preserve opacity. Cancel discards preview.
Version=0.1.0-dev

[Variables]
@Include=#@#Defaults.inc
@Include2=#@#User\Settings.inc
Columns=2
PanelHeight=376
@Include3=#@#Geometry.inc
@Include4=#@#Styles.inc
; Neutral editor text stays readable while any editable text color is black.
PickerTextColor=220,220,220
PickerMutedColor=175,175,175
PickerBackgroundColor=15,15,15,255
PickerBorderColor=50,50,50,255
PickerPlaneWidth=(#ContentWidth#-122*#Scale#)
PickerPlaneHeight=(136*#Scale#)
PickerControlX=(#ContentX#+#PickerPlaneWidth#+10*#Scale#)

[MeasureColorPicker]
Measure=Script
ScriptFile=#@#Modules\ColorPicker\ColorPicker.lua

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel
Shape=Rectangle (0.5*#Scale#),(0.5*#Scale#),(#PanelWidth#-#Scale#),(#PanelHeightPx#-#Scale#),(#CornerRadius#*#Scale#) | Fill Color #PickerBackgroundColor# | Stroke Color #PickerBorderColor# | StrokeWidth #Scale#

[MeterTitle]
Meter=String
MeterStyle=StyleTitle|StyleTitleRow
FontColor=#PickerTextColor#
Group=PickerUI
X=(#ContentX#+10*#Scale#)
W=(#ContentWidth#-20*#Scale#)
Text=Accent Color 1

[MeterModeRGB]
Meter=String
MeterStyle=StyleButton
FontColor=#PickerTextColor#
Group=PickerUI
X=#ContentX#
Y=(#Inset#+34*#Scale#)
W=(#ContentWidth#/3-10*#Scale#)
Text=RGB
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "SetMode('RGB')"]

[MeterModeHSV]
Meter=String
MeterStyle=StyleButton
FontColor=#PickerTextColor#
Group=PickerUI
X=(#ContentX#+#ContentWidth#/3)
Y=(#Inset#+34*#Scale#)
W=(#ContentWidth#/3-10*#Scale#)
Text=HSV
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "SetMode('HSV')"]

[MeterModeLAB]
Meter=String
MeterStyle=StyleButton
FontColor=#PickerTextColor#
Group=PickerUI
X=(#ContentX#+2*#ContentWidth#/3)
Y=(#Inset#+34*#Scale#)
W=(#ContentWidth#/3-6*#Scale#)
Text=CIELAB
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "SetMode('LAB')"]

[MeterDescription]
Meter=String
MeterStyle=StyleLabel
FontColor=#PickerMutedColor#
Group=PickerUI
Y=(#Inset#+60*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
Text=S / V plane  |  Hue strip

[MeterSpectrum]
Meter=Shape
X=#ContentX#
Y=(#Inset#+80*#Scale#)
W=#PickerPlaneWidth#
H=#PickerPlaneHeight#
Shape=Rectangle 0,0,#PickerPlaneWidth#,#PickerPlaneHeight# | Fill Color #TrackColor# | StrokeWidth 0
UpdateDivider=-1

[MeterPlaneMarker]
Meter=Shape
Group=PickerUI
X=#ContentX#
Y=(#Inset#+80*#Scale#)
W=#PickerPlaneWidth#
H=#PickerPlaneHeight#
Shape=Ellipse 4,4,3 | Fill Color 0,0,0,0 | Stroke Color 255,255,255 | StrokeWidth 1
UpdateDivider=-1

[MeterPlaneHit]
Meter=Image
X=#ContentX#
Y=(#Inset#+80*#Scale#)
W=#PickerPlaneWidth#
H=#PickerPlaneHeight#
SolidColor=0,0,0,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "SelectPlane($MouseX:%$,$MouseY:%$)"]
ToolTipText=Click to change the two plane channels.
UpdateDivider=-1

[MeterSliceLabel]
Meter=String
MeterStyle=StyleLabel
FontColor=#PickerMutedColor#
Y=(#Inset#+222*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
Text=Click the strip to change the plane slice

[MeterSlice]
Meter=Shape
Group=PickerUI
X=#ContentX#
Y=(#Inset#+244*#Scale#)
W=#ContentWidth#
H=(16*#Scale#)
Shape=Rectangle 0,0,#ContentWidth#,(16*#Scale#) | Fill LinearGradient SliceGradient | StrokeWidth 0
SliceGradient=180 | 255,0,0;0 | 255,0,0;1
UpdateDivider=-1

[MeterSliceMarker]
Meter=Shape
Group=PickerUI
X=#ContentX#
Y=(#Inset#+244*#Scale#)
W=#ContentWidth#
H=(16*#Scale#)
Shape=Rectangle 0,0,2,(16*#Scale#) | Fill Color 255,255,255 | StrokeWidth 0
UpdateDivider=-1

[MeterSliceHit]
Meter=Image
X=#ContentX#
Y=(#Inset#+244*#Scale#)
W=#ContentWidth#
H=(16*#Scale#)
SolidColor=0,0,0,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "SelectSlice($MouseX:%$)"]
ToolTipText=Click to change the remaining channel.
UpdateDivider=-1

[MeterOriginalLabel]
Meter=String
MeterStyle=StyleLabel
FontColor=#PickerMutedColor#
Y=(#Inset#+271*#Scale#)
W=(52*#Scale#)
Text=Current

[MeterOriginal]
Meter=Image
Group=PickerUI
X=(#ContentX#+56*#Scale#)
Y=(#Inset#+272*#Scale#)
W=(24*#Scale#)
H=(16*#Scale#)
SolidColor=#AccentColor#
UpdateDivider=-1

[MeterPreviewLabel]
Meter=String
MeterStyle=StyleLabel
FontColor=#PickerMutedColor#
X=(#ContentX#+90*#Scale#)
Y=(#Inset#+271*#Scale#)
W=(54*#Scale#)
Text=New

[MeterPreview]
Meter=Image
Group=PickerUI
X=(#ContentX#+126*#Scale#)
Y=(#Inset#+272*#Scale#)
W=(24*#Scale#)
H=(16*#Scale#)
SolidColor=#AccentColor#
UpdateDivider=-1

[MeterHex]
Meter=String
MeterStyle=StyleLabel
Group=PickerUI
X=(#ContentX#+162*#Scale#)
Y=(#Inset#+270*#Scale#)
W=(#ContentWidth#-162*#Scale#)
FontColor=#PickerTextColor#
Text=#89BEFA

[MeterStatus]
Meter=String
MeterStyle=StyleLabel
FontColor=#PickerMutedColor#
Group=PickerUI
Y=(#Inset#+298*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
Text=Preview only. Apply saves this global color.

[MeterCancel]
Meter=String
MeterStyle=StyleButton
FontColor=#PickerTextColor#
X=(#ContentX#+10*#Scale#)
Y=(#Inset#+328*#Scale#)
W=(72*#Scale#)
Text=Cancel
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "Cancel()"]

[MeterApply]
Meter=String
MeterStyle=StyleButton
FontColor=#PickerTextColor#
X=(#ContentX#+#ContentWidth#-88*#Scale#)
Y=(#Inset#+328*#Scale#)
W=(72*#Scale#)
SolidColor=#TrackColor#
Text=Apply
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "Apply()"]

[MeterHelp]
Meter=String
MeterStyle=StyleLabel
FontColor=#PickerMutedColor#
Y=(#Inset#+352*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
Text=Channel buttons: 1 step. Mouse wheel: 1 step.

[MeterChannelLabel1]
Meter=String
MeterStyle=StyleLabel
FontColor=#PickerMutedColor#
Group=PickerUI
X=#PickerControlX#
Y=(#Inset#+79*#Scale#)
W=(110*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
Text=Channel

[MeterChannelMinus1]
