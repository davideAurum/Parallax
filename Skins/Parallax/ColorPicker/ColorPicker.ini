[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
OnRefreshAction=[!CommandMeasure MeasureColorPicker "Render()"]
ContextTitle=Global settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]

[Metadata]
Name=Global Color Picker
Author=Parallax
Information=Event-driven RGB, HSV and CIELAB D50 picker. The title dropdown lists every color variable in the suite. Launcher.lua opens it on one target, beside the skin that owns the swatch. Cancel discards the preview.
Version=0.1.0-dev

[Variables]
@Include=#@#Defaults.inc
@Include2=#@#User\Settings.inc
; One fixed-width column, wide enough for "Color picker: <target>" at the
; largest title size. Gutter, scale, padding, rounding and fonts stay the suite's.
Columns=1
ColumnWidth=280
PanelHeight=262
@Include3=#@#Geometry.inc
@Include4=#@#Styles.inc
; Neutral editor text stays readable while any editable text color is black.
PickerTextColor=220,220,220
PickerMutedColor=175,175,175
PickerBackgroundColor=15,15,15,255
PickerBorderColor=50,50,50,255
PickerPlaneHeight=(112*#Scale#)
PickerCell=(#ContentWidth#/3)

[MeasureColorPicker]
Measure=Script
ScriptFile=#@#Modules\ColorPicker\ColorPicker.lua

[StylePickerTitle]
FontFace=#FontFace#
FontSize=(#TitleFontSize#*#Scale#)
FontWeight=600
AntiAlias=1
StringAlign=LeftCenter
Y=#TitleRowCenterY#
H=#TitleRowHeight#

[StylePickerLabel]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#PickerTextColor#
AntiAlias=1
ClipString=1
H=(18*#Scale#)

[StylePickerButton]
FontFace=#FontFace#
FontSize=(#FontSize#*#Scale#)
FontWeight=500
FontColor=#PickerTextColor#
AntiAlias=1
ClipString=1
SolidColor=0,0,0,1
MouseActionCursor=1
H=(18*#Scale#)

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel
Shape=Rectangle (0.5*#Scale#),(0.5*#Scale#),(#PanelWidth#-#Scale#),(#PanelHeightPx#-#Scale#),(#CornerRadius#*#Scale#) | Fill Color #PickerBackgroundColor# | Stroke Color #PickerBorderColor# | StrokeWidth #Scale#

; Title: "Color picker:" then the target, which is the dropdown. The chevron
; follows the target text; both open the same list.
[MeterTitle]
Meter=String
MeterStyle=StylePickerTitle
FontColor=#PickerMutedColor#
Group=PickerUI
X=#ContentX#
Text=Color picker:

[MeterTarget]
Meter=String
MeterStyle=StylePickerTitle
FontColor=#PickerTextColor#
SolidColor=0,0,0,1
MouseActionCursor=1
Group=PickerUI
X=(5*#Scale#)R
Text=Accent Color 1
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "ToggleMenu()"]

[MeterTargetChevron]
Meter=Shape
Group=PickerUI
X=(1*#Scale#)R
Y=(#TitleRowCenterY#-#TitleRowHeight#/2)
Shape=Rectangle 0,0,(14*#Scale#),#TitleRowHeight# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path ChevronPath | Fill Color #PickerMutedColor# | StrokeWidth 0
ChevronPath=(3*#Scale#),(9*#Scale#) | LineTo (10*#Scale#),(9*#Scale#) | LineTo (6.5*#Scale#),(13.5*#Scale#) | ClosePath 1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "ToggleMenu()"]
UpdateDivider=-1

; ---- Body: replaced by the dropdown list while it is open ----
[MeterSpectrum]
Meter=Shape
Group=PickerBody
X=#ContentX#
Y=(#Inset#+36*#Scale#)
W=#ContentWidth#
H=#PickerPlaneHeight#
Shape=Rectangle 0,0,#ContentWidth#,#PickerPlaneHeight# | Fill Color #TrackColor# | StrokeWidth 0
UpdateDivider=-1

[MeterPlaneMarker]
Meter=Shape
Group=PickerUI|PickerBody
X=#ContentX#
Y=(#Inset#+36*#Scale#)
W=#ContentWidth#
H=#PickerPlaneHeight#
Shape=Ellipse 4,4,3 | Fill Color 0,0,0,0 | Stroke Color 255,255,255 | StrokeWidth 1
UpdateDivider=-1

[MeterPlaneHit]
Meter=Image
Group=PickerBody
X=#ContentX#
Y=(#Inset#+36*#Scale#)
W=#ContentWidth#
H=#PickerPlaneHeight#
SolidColor=0,0,0,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure MeasureColorPicker "SelectPlane($MouseX:%$,$MouseY:%$)"]
UpdateDivider=-1

[MeterSlice]
Meter=Shape
Group=PickerUI|PickerBody
X=#ContentX#
Y=(#Inset#+154*#Scale#)
W=#ContentWidth#
H=(14*#Scale#)
Shape=Rectangle 0,0,#ContentWidth#,(14*#Scale#) | Fill LinearGradient SliceGradient | StrokeWidth 0
SliceGradient=180 | 255,0,0;0 | 255,0,0;1
UpdateDivider=-1

[MeterSliceMarker]
