; What Parallax connects to, in one place: the Spotify account, with its sign-in,
; and the helpers and programs on this PC that need none. Opened from Global
; Settings and from Media. While it is open the controller reads a few small local
; status files every 2 s; nothing here starts by itself.
[Rainmeter]
Update=2000
DefaultUpdateDivider=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
; Used once, before Rainmeter has a saved position for this panel.
DefaultWindowX=50%
DefaultWindowY=40%
DefaultAnchorX=50%
DefaultAnchorY=40%
ContextTitle=Global settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Media settings
ContextAction2=[!ActivateConfig "Parallax\Media\Settings" "Settings.ini"]

[Metadata]
Name=Parallax Connections
Author=Parallax
Information=The accounts and helpers Parallax uses, with their state. Sign in and Disconnect manage the optional Spotify account; Pair, Start, Stop and Forget the optional TV link; Turn on, Turn off and Forget the optional cast link; everything else is read only.
Version=0.1.0-dev

[Variables]
@Include=#@#Defaults.inc
@Include2=#@#User\Settings.inc
Columns=2
PanelHeight=510
@Include3=#@#Geometry.inc
@Include4=#@#Styles.inc
; Connections.lua sets this from User\Media.inc, as Media settings does.
QueuePollSeconds=30
; Name, state and link columns. The name and link widths hold their longest
; text at the 10 pt body maximum; the state takes the rest.
ConnectionsNameWidth=(122*#Scale#)
ConnectionsLinkWidth=(106*#Scale#)
ConnectionsStateX=(#ContentX#+#ConnectionsNameWidth#+6*#Scale#)
ConnectionsStateWidth=(#ContentWidth#-#ConnectionsNameWidth#-#ConnectionsLinkWidth#-12*#Scale#)
ConnectionsButtonWidth=((#ContentWidth#-8*#Scale#)/3)
; Until when a TV row or Casts row command counts as running (TvConnections.lua,
; CastConnections.lua): each row sets its own and reads the other's, so the two
; never overlap on their shared command host, MeasureTvControl.
TvCommandBusyUntil=0
CastCommandBusyUntil=0

; HWiNFO, read as CPU Meter reads it: is it running, and does it export sensors.
; Read again every 10 s. DynamicVariables reopens the registry key on each read;
; a value list otherwise keeps it open after HWiNFO deletes it.
[MeasureHWiNFORunning]
Measure=Process
ProcessName=HWiNFO64.exe
UpdateDivider=5

[MeasureHWiNFOUser]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
OutputType=ValueList
OutputDelimiter=|
DynamicVariables=1
UpdateDivider=5

[MeasureHWiNFOMachine]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\HWiNFO64\VSB
OutputType=ValueList
OutputDelimiter=|
DynamicVariables=1
UpdateDivider=5

[MeasureConnections]
Measure=Script
ScriptFile=#@#Modules\Connections\Connections.lua
UpdateDivider=1

; The TV row (YouTube in the TV's own app): its own controller, which reads only
; the TV worker's files.
[MeasureTvConnections]
Measure=Script
ScriptFile=#@#Modules\Connections\TvConnections.lua
UpdateDivider=1

; The Casts row (a YouTube cast from Chrome, followed on the TV): its own
; controller, which reads only the cast switch, key presence and state files and
; runs its commands through MeasureTvControl.
[MeasureCastConnections]
Measure=Script
ScriptFile=#@#Modules\Connections\CastConnections.lua
UpdateDivider=1

; Inert until a Start, Stop or confirmed Forget click: TvConnections.lua sets one
; of three fixed command lines and runs it once, hidden. The Casts row's Turn on,
; Turn off and confirmed Forget use it the same way (CastConnections.lua).
[MeasureTvControl]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Modules\Media\TvQueue\
Parameter=-NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File "TvProvider.ps1" -Command "Stop" -Quiet
State=Hide
OutputType=UTF8
Timeout=60000
FinishAction=[!UpdateMeasure MeasureTvControl][!CommandMeasure MeasureTvConnections "CommandFinished()"][!CommandMeasure MeasureCastConnections "CommandFinished()"]
UpdateDivider=-1

; Inert until the confirmed Disconnect click runs it once, hidden.
[MeasureConnectionsDisconnect]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Modules\Media\Queue\
Parameter=-NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File "QueueProvider.ps1" -Command "Disconnect" -Quiet
State=Hide
OutputType=UTF8
Timeout=60000
FinishAction=[!UpdateMeasure MeasureConnectionsDisconnect][!CommandMeasure MeasureConnections "DisconnectFinished()"]
UpdateDivider=-1

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

; Two linked nodes.
[MeterIcon]
Meter=Shape
X=#ContentX#
Y=(#TitleRowCenterY#-#TitleIconSize#/2)
W=#TitleIconSize#
H=#TitleIconSize#
Shape=Line (4*#TitleIconScale#),(7*#TitleIconScale#),(10*#TitleIconScale#),(7*#TitleIconScale#) | Stroke Color #AccentColor# | StrokeWidth (2*#TitleIconScale#)
Shape2=Ellipse (3.5*#TitleIconScale#),(7*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor# | StrokeWidth 0
Shape3=Ellipse (10.5*#TitleIconScale#),(7*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor2# | StrokeWidth 0
AntiAlias=1
UpdateDivider=-1

[MeterTitle]
