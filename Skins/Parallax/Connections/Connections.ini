X=(#ContentX#+#ContentWidth#-20*#Scale#)
Y=(#TitleRowCenterY#-10*#Scale#)
W=(20*#Scale#)
H=(20*#Scale#)
SolidColor=0,0,0,1
Shape=Line (5*#Scale#),(5*#Scale#),(15*#Scale#),(15*#Scale#) | Stroke Color 220,220,220 | StrokeWidth (1.5*#Scale#)
Shape2=Line (15*#Scale#),(5*#Scale#),(5*#Scale#),(15*#Scale#) | Stroke Color 220,220,220 | StrokeWidth (1.5*#Scale#)
LeftMouseUpAction=[!DeactivateConfig]
MouseActionCursor=1
UpdateDivider=-1

