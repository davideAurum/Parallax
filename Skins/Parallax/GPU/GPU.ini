[Rainmeter]
Update=#MetricsInterval#
AccurateText=1
DynamicWindowSize=0
Group=Parallax|ParallaxGPU
OnRefreshAction=[!CommandMeasure MeasureGPUInfo "Run"]
MouseActionCursor=0
MouseOverAction=[!HideMeter MeterActivityValue][!ShowMeter MeterOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterOptions][!ShowMeter MeterActivityValue][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=GPU settings
ContextAction2=[!ActivateConfig "Parallax\GPU\Settings" "Settings.ini"]
ContextTitle3=Refresh GPU after editing
ContextAction3=[!Refresh]
ContextTitle4=GPU mapping guide
ContextAction4=["notepad.exe" "#@#Modules\GPU\Mapping.txt"]

[Metadata]
Name=Parallax GPU
Author=Parallax contributors
Information=Discrete GPU capabilities, peak process GPU engine activity and optional mapped HWiNFO registry snapshots.
Version=0.1.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\GPU.inc
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\GPU\Measures.inc

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterIcon]
Meter=Shape
X=#ContentX#
Y=(#Inset#+8*#Scale#)
W=(16*#Scale#)
H=(14*#Scale#)
Shape=Rectangle (1*#Scale#),(2*#Scale#),(12*#Scale#),(8*#Scale#),(1*#Scale#) | Fill Color 0,0,0,0 | Stroke Color #GPUColor# | StrokeWidth (1*#Scale#)
Shape2=Ellipse (7*#Scale#),(6*#Scale#),(2*#Scale#),(2*#Scale#) | Fill Color #GPUColor# | StrokeWidth 0
Shape3=Line (3*#Scale#),(10*#Scale#),(3*#Scale#),(12*#Scale#) | Stroke Color #GPUColor# | StrokeWidth (1*#Scale#)
Shape4=Line (6*#Scale#),(10*#Scale#),(6*#Scale#),(12*#Scale#) | Stroke Color #GPUColor# | StrokeWidth (1*#Scale#)
Shape5=Line (9*#Scale#),(10*#Scale#),(9*#Scale#),(12*#Scale#) | Stroke Color #GPUColor# | StrokeWidth (1*#Scale#)
UpdateDivider=-1

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=(#ContentX#+20*#Scale#)
Y=(#Inset#+6*#Scale#)
W=(54*#Scale#)
H=(18*#Scale#)
Text=GPU

[MeterAdapterPanel]
Meter=Shape
X=#ContentX#
Y=(#Inset#+26*#Scale#)
W=#ContentWidth#
H=(122*#Scale#)
Shape=Rectangle 0.5,0.5,(#ContentWidth#-1),(122*#Scale#-1),(2*#Scale#) | Fill Color #GraphBackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1
UpdateDivider=-1

[MeterAdapterName]
Meter=String
MeterStyle=StyleLabel
Group=GPUReadout
X=(#ContentX#+4*#Scale#)
Y=(#Inset#+30*#Scale#)
W=(#ContentWidth#-8*#Scale#)
H=(18*#Scale#)
FontColor=#TextColor#
Text=Checking...

[StyleGPUCapabilityLabel]
X=(#ContentX#+4*#Scale#)
W=(68*#Scale#)
H=(18*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)

[StyleGPUCapabilityValue]
Group=GPUReadout
X=(#ContentX#+#ContentWidth#-4*#Scale#)
W=(#ContentWidth#-80*#Scale#)
H=(18*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
StringAlign=Right
FontColor=#TextColor#
Text=Checking...

[MeterVRAMLabel]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityLabel
Y=(#Inset#+52*#Scale#)
Text=VRAM
ToolTipText=Dedicated video memory capacity reported by Windows for the named discrete GPU. Hover its value for details.

[MeterVRAMValue]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityValue
Y=(#Inset#+52*#Scale#)

[MeterDirect3DLabel]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityLabel
Y=(#Inset#+70*#Scale#)
Text=Direct3D
ToolTipText=Highest Direct3D hardware feature level exposed by this GPU and driver.

[MeterDirect3DValue]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityValue
Y=(#Inset#+70*#Scale#)

[MeterShaderLabel]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityLabel
Y=(#Inset#+88*#Scale#)
Text=Shader
ToolTipText=Highest shader model reported by the Direct3D 12 device.

[MeterShaderValue]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityValue
Y=(#Inset#+88*#Scale#)

[MeterRayTracingLabel]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityLabel
Y=(#Inset#+106*#Scale#)
Text=Ray tracing
ToolTipText=DirectX ray-tracing API support. The tier does not identify dedicated ray-tracing cores or predict speed.

[MeterRayTracingValue]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityValue
Y=(#Inset#+106*#Scale#)

[MeterDriverLabel]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityLabel
Y=(#Inset#+124*#Scale#)
Text=Driver
ToolTipText=Windows driver version for the named discrete GPU. Hover for the complete version.

[MeterDriverValue]
Meter=String
MeterStyle=StyleLabel|StyleGPUCapabilityValue
Y=(#Inset#+124*#Scale#)

[MeterActivityLabel]
Meter=String
MeterStyle=StyleHeader
Y=(#Inset#+154*#Scale#)
H=(16*#Scale#)
Text=Peak process engine
ToolTipText=Highest reported per-process engine activity across exposed GPUs. This is not whole-adapter utilization. Counter sample age is not exposed.

[MeterActivityValue]
Meter=String
MeterStyle=StyleTitle
FontSize=((#FontSize#+1)*#Scale#)
Group=GPUReadout
X=(#ContentX#+#ContentWidth#)
Y=(#Inset#+6*#Scale#)
W=(70*#Scale#)
H=(18*#Scale#)
StringAlign=Right
FontColor=#GPUColor#
Text=--

[MeterActivityDetail]
Meter=String
MeterStyle=StyleLabel
Group=GPUReadout
Y=(#Inset#+170*#Scale#)
H=(16*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
Text=Waiting for counter

[MeterActivityScope]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+186*#Scale#)
H=(16*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
FontColor=#MutedColor#
Text=All GPUs / not adapter total
ToolTipText=A single ranked process engine observation, not the sum of engine percentages. Idle and missing counters both yield no ranked observation.

[MeterRule]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+206*#Scale#)

[MeterTemperatureLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+212*#Scale#)
W=(68*#Scale#)
H=(18*#Scale#)
Text=Temp.
ToolTipText=Optional mapped GPU temperature. Hover its value for the exported sensor identity and unit.

[MeterTemperatureValue]
Meter=String
MeterStyle=StyleLabel
Group=GPUReadout
X=(#ContentX#+#ContentWidth#)
Y=(#Inset#+212*#Scale#)
W=(#ContentWidth#-72*#Scale#)
H=(18*#Scale#)
StringAlign=Right
FontColor=#TextColor#
Text=Off

[MeterPowerLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+230*#Scale#)
W=(68*#Scale#)
H=(18*#Scale#)
Text=Power

[MeterPowerValue]
Meter=String
MeterStyle=StyleLabel
Group=GPUReadout
X=(#ContentX#+#ContentWidth#)
Y=(#Inset#+230*#Scale#)
W=(#ContentWidth#-72*#Scale#)
H=(18*#Scale#)
StringAlign=Right
FontColor=#TextColor#
Text=Off

[MeterClockLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+248*#Scale#)
W=(68*#Scale#)
H=(18*#Scale#)
Text=Clock

[MeterClockValue]
Meter=String
MeterStyle=StyleLabel
Group=GPUReadout
X=(#ContentX#+#ContentWidth#)
Y=(#Inset#+248*#Scale#)
W=(#ContentWidth#-72*#Scale#)
H=(18*#Scale#)
StringAlign=Right
FontColor=#TextColor#
Text=Off

[MeterSensorStatus]
Meter=String
MeterStyle=StyleLabel
Group=GPUReadout
Y=(#Inset#+268*#Scale#)
H=(14*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
FontColor=#MutedColor#
Text=Sensors off / use gear
ToolTipText=Optional HWiNFO Gadget registry export. No external plugin or Shared Memory required. Exported values do not prove provider freshness.

[MeterOptions]
Meter=Shape
X=(#ContentX#+#ContentWidth#-18*#Scale#)
Y=(#Inset#+6*#Scale#)
W=(18*#Scale#)
H=(18*#Scale#)
; Original eight-tooth gear; hidden meters have no mouse hit target.
Shape=Path GearPath | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Ellipse (9*#Scale#),(9*#Scale#),(2.5*#Scale#),(2.5*#Scale#) | Fill Color #BackgroundColor# | StrokeWidth 0
GearPath=(9.000*#Scale#),(3.300*#Scale#) | LineTo (10.444*#Scale#),(1.742*#Scale#) | LineTo (11.832*#Scale#),(2.163*#Scale#) | LineTo (12.167*#Scale#),(4.261*#Scale#) | LineTo (13.031*#Scale#),(4.969*#Scale#) | LineTo (15.153*#Scale#),(4.889*#Scale#) | LineTo (15.837*#Scale#),(6.168*#Scale#) | LineTo (14.590*#Scale#),(7.888*#Scale#) | LineTo (14.700*#Scale#),(9.000*#Scale#) | LineTo (16.258*#Scale#),(10.444*#Scale#) | LineTo (15.837*#Scale#),(11.832*#Scale#) | LineTo (13.739*#Scale#),(12.167*#Scale#) | LineTo (13.031*#Scale#),(13.031*#Scale#) | LineTo (13.111*#Scale#),(15.153*#Scale#) | LineTo (11.832*#Scale#),(15.837*#Scale#) | LineTo (10.112*#Scale#),(14.590*#Scale#) | LineTo (9.000*#Scale#),(14.700*#Scale#) | LineTo (7.556*#Scale#),(16.258*#Scale#) | LineTo (6.168*#Scale#),(15.837*#Scale#) | LineTo (5.833*#Scale#),(13.739*#Scale#) | LineTo (4.969*#Scale#),(13.031*#Scale#) | LineTo (2.847*#Scale#),(13.111*#Scale#) | LineTo (2.163*#Scale#),(11.832*#Scale#) | LineTo (3.410*#Scale#),(10.112*#Scale#) | LineTo (3.300*#Scale#),(9.000*#Scale#) | LineTo (1.742*#Scale#),(7.556*#Scale#) | LineTo (2.163*#Scale#),(6.168*#Scale#) | LineTo (4.261*#Scale#),(5.833*#Scale#) | LineTo (4.969*#Scale#),(4.969*#Scale#) | LineTo (4.889*#Scale#),(2.847*#Scale#) | LineTo (6.168*#Scale#),(2.163*#Scale#) | LineTo (7.888*#Scale#),(3.410*#Scale#) | ClosePath 1
Hidden=1
UpdateDivider=-1
MouseActionCursor=1
LeftMouseUpAction=[!ActivateConfig "Parallax\GPU\Settings" "Settings.ini"]
ToolTipText=Open the separate GPU Settings utility.

