[Rainmeter]
Update=#MetricsInterval#
AccurateText=1
DynamicWindowSize=0
Group=Parallax|ParallaxGPU
OnRefreshAction=[!CommandMeasure MeasureGPUInfo "Run"]
OnCloseAction=[!CommandMeasure MeasureGPUTemperatureController "Stop()"]
MouseActionCursor=0
MouseOverAction=[!HideMeter MeterActivityValue][!ShowMeter MeterOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterOptions][!ShowMeter MeterActivityValue][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=GPU settings
ContextAction2=[!ActivateConfig "Parallax\GPU\Settings" "Settings.ini"]
ContextTitle3=Refresh GPU after editing
ContextAction3=[!Refresh]
ContextTitle4=GPU mapping guide
ContextAction4=["notepad.exe" "#@#Modules\GPU\Mapping.txt"]

[Metadata]
Name=Parallax GPU
Author=Parallax contributors
Information=GPU Meter: discrete GPU overview, driver temperature/power/current clock, an engine activity table, dedicated VRAM and shared-memory readings, a per-process GPU usage/VRAM table and a GPU load history graph, with explicit optional HWiNFO overrides.
Version=0.1.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\GPU.inc
@Include4=#@#Geometry.inc
; Layout (logical px below the panel origin, before Scale): title row; adapter
; inset 26-60; Temp/Power/Clock rows 68/84/100; Engine table header 124, rule
; 140, four 16 px rows from 144, footer rule 210; VRAM row 218 with its bar at
; 238, Shared row 250; Process table header 276, rule 292, five 16 px rows
; from 296, footer rule 378; History header 386 and graph 406. Everything
; after the VRAM bar shifts down by #GPUBarExtra# when the shared bar
; thickness exceeds its 6 px default, exactly like Memory Meter's rows.
GPUBarExtra=(Max(0,#DataBarThickness#-6))
; Natural content height. Larger saved PanelHeight values are honored, as in
; Memory Meter. 650 was the Fit value of the pre-2026-10 layout and is still
; the shipped value in older User\GPU.inc files, so it is treated as Fit
; rather than as a 188 px taller custom minimum.
GPUNaturalHeight=(414+#GraphHeight#+#GPUBarExtra#)
PanelHeightPx=(Round(Max(#PanelHeight#*(1-(#PanelHeight#=650)),#GPUNaturalHeight#)*#Scale#))
; Engine table columns: label, then a bar that ends 4 px before the centered
; percentage column, matching the CPU thread table.
GPUEngineLabelWidth=(52*#Scale#)
GPUEngineValueWidth=(42*#Scale#)
GPUEngineBarX=(#ContentX#+56*#Scale#)
GPUEngineBarWidth=(#ContentWidth#-102*#Scale#)
; Process table columns: GPU % at the right, dedicated VRAM beside it, both
; centered under their icon headers like the CPU process table.
GPUProcessValueWidth=(46*#Scale#)
GPUProcessMemoryWidth=(58*#Scale#)
@Include5=#@#Styles.inc
@Include6=#@#Modules\GPU\Measures.inc
@Include7=#@#Modules\GPU\ProcessMeasures.inc
@Include9=#@#Modules\GPU\TemperatureMeasures.inc

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterIcon]
Meter=Shape
X=#ContentX#
Y=(#TitleRowCenterY#-#TitleIconSize#/2)
W=#TitleIconSize#
H=#TitleIconSize#
; User-selected Lucide GPU. Source and license: Modules\GPU\Icons\Lucide\.
; Preserve the 24-unit SVG geometry at the shared 14-unit title-icon size.
Shape=Path LucideGPUBoard | Extend LucideGPUStroke
Shape2=Line (2*14*#TitleIconScale#/24),(21*14*#TitleIconScale#/24),(2*14*#TitleIconScale#/24),(3*14*#TitleIconScale#/24) | Extend LucideGPUStroke
Shape3=Path LucideGPUConnector | Extend LucideGPUStroke
Shape4=Ellipse (16*14*#TitleIconScale#/24),(11*14*#TitleIconScale#/24),(2*14*#TitleIconScale#/24),(2*14*#TitleIconScale#/24) | Extend LucideGPUStroke
Shape5=Ellipse (8*14*#TitleIconScale#/24),(11*14*#TitleIconScale#/24),(2*14*#TitleIconScale#/24),(2*14*#TitleIconScale#/24) | Extend LucideGPUStroke
LucideGPUStroke=Fill Color 0,0,0,0 | Stroke Color #GPUColor# | StrokeWidth (2*14*#TitleIconScale#/24) | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
LucideGPUBoard=(2*14*#TitleIconScale#/24),(17*14*#TitleIconScale#/24) | LineTo (20*14*#TitleIconScale#/24),(17*14*#TitleIconScale#/24) | ArcTo (22*14*#TitleIconScale#/24),(15*14*#TitleIconScale#/24),(2*14*#TitleIconScale#/24),(2*14*#TitleIconScale#/24),0,1,0 | LineTo (22*14*#TitleIconScale#/24),(7*14*#TitleIconScale#/24) | ArcTo (20*14*#TitleIconScale#/24),(5*14*#TitleIconScale#/24),(2*14*#TitleIconScale#/24),(2*14*#TitleIconScale#/24),0,1,0 | LineTo (2*14*#TitleIconScale#/24),(5*14*#TitleIconScale#/24)
LucideGPUConnector=(7*14*#TitleIconScale#/24),(17*14*#TitleIconScale#/24) | LineTo (7*14*#TitleIconScale#/24),(20*14*#TitleIconScale#/24) | ArcTo (8*14*#TitleIconScale#/24),(21*14*#TitleIconScale#/24),(1*14*#TitleIconScale#/24),(1*14*#TitleIconScale#/24),0,1,0 | LineTo (13*14*#TitleIconScale#/24),(21*14*#TitleIconScale#/24) | ArcTo (14*14*#TitleIconScale#/24),(20*14*#TitleIconScale#/24),(1*14*#TitleIconScale#/24),(1*14*#TitleIconScale#/24),0,1,0 | LineTo (14*14*#TitleIconScale#/24),(17*14*#TitleIconScale#/24)
UpdateDivider=-1

[MeterTitle]
Meter=String
MeterStyle=StyleTitle|StyleTitleRow
X=(#ContentX#+#TitleIconSize#+#TitleIconGap#)
W=(#ContentWidth#-#TitleIconSize#-#TitleIconGap#-64*#Scale#)
Text=GPU Meter
ToolTipText=Main discrete GPU selected by Windows. The header value is the driver's own GPU busy time; the Engine table, VRAM, process table and History break it down.

; Driver GPU busy time (the Core engine), the same figure the History graph
; traces. The CPU-style gear replaces it on hover.
[MeterActivityValue]
Meter=String
MeterStyle=StyleTitle|StyleTitleRow
FontSize=((#FontSize#+1)*#Scale#)
Group=GPUReadout|GPUDriverReadout
X=(#ContentX#+#ContentWidth#)
W=(60*#Scale#)
StringAlign=RightCenter
FontColor=#GPUColor#
Text=--
ToolTipText=GPU busy time from the selected card's driver over the preceding one-second interval. Waiting for the first direct driver sample.

[MeterAdapterPanel]
Meter=Shape
X=#ContentX#
Y=(#Inset#+26*#Scale#)
W=#ContentWidth#
H=(34*#Scale#)
Shape=Rectangle 0.5,0.5,(#ContentWidth#-1),(34*#Scale#-1),(2*#Scale#) | Fill Color #GraphBackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1
UpdateDivider=-1

[MeterAdapterName]
Meter=String
MeterStyle=StyleLabel
Group=GPUReadout
X=(#ContentX#+4*#Scale#)
Y=(#Inset#+28*#Scale#)
W=(#ContentWidth#-8*#Scale#)
H=(16*#Scale#)
FontColor=#TextColor#
Text=Checking...

; Memory size/type and base-boost graphics clocks, in the CPU inset's accent
; detail style. GPU.lua keeps the exact bytes, kHz and vendor in the tooltip.
[MeterAdapterDetails]
Meter=String
MeterStyle=StyleLabel
Group=GPUReadout
X=(#ContentX#+4*#Scale#)
Y=(#Inset#+44*#Scale#)
W=(#ContentWidth#-8*#Scale#)
H=(16*#Scale#)
FontColor=#AccentColor#
Text=Checking...
ToolTipText=Memory size and type followed by the base-boost graphics clock specifications. Read from the detected GPU at load or refresh.

; Direct driver scalars in the CPU meter's Clock/Fan row style, with the
; values flush right so they share one edge with the VRAM and Shared rows.
[MeterTemperatureLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+68*#Scale#)
W=(50*#Scale#)
H=(16*#Scale#)
Text=Temp:
ToolTipText=Standard GPU temperature from the selected card's driver, independent of HWiNFO. Hotspot is a separate reading. Hover the value for its source and status.

[MeterTemperatureValue]
Meter=String
MeterStyle=StyleValue
Group=GPUReadout|GPUDriverReadout
X=(#ContentX#+#ContentWidth#)
Y=(#Inset#+68*#Scale#)
W=(#ContentWidth#-54*#Scale#)
H=(16*#Scale#)
StringAlign=Right
FontSize=(#FontSize#*#Scale#)
FontColor=#AccentColor2#
Text=Checking...

[MeterPowerLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+84*#Scale#)
W=(50*#Scale#)
H=(16*#Scale#)
Text=Power:
ToolTipText=Actual power draw reported by the selected source. The driver reading includes the GPU and associated circuitry; it is not a power limit.

[MeterPowerValue]
Meter=String
MeterStyle=StyleValue
Group=GPUDriverReadout
X=(#ContentX#+#ContentWidth#)
Y=(#Inset#+84*#Scale#)
W=(#ContentWidth#-54*#Scale#)
H=(16*#Scale#)
StringAlign=Right
FontSize=(#FontSize#*#Scale#)
FontColor=#AccentColor2#
Text=Checking...

[MeterClockLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+100*#Scale#)
W=(50*#Scale#)
H=(16*#Scale#)
Text=Clock:
ToolTipText=Current graphics clock from the selected source. Base and boost reference clocks remain in the overview.

[MeterClockValue]
Meter=String
MeterStyle=StyleValue
Group=GPUDriverReadout
X=(#ContentX#+#ContentWidth#)
Y=(#Inset#+100*#Scale#)
W=(#ContentWidth#-54*#Scale#)
H=(16*#Scale#)
StringAlign=Right
FontSize=(#FontSize#*#Scale#)
FontColor=#AccentColor2#
Text=Checking...

[GPUDriverMeterInclude]
@Include10=#@#Modules\GPU\DriverMeters.inc

[GPUProcessMeterInclude]
@Include8=#@#Modules\GPU\ProcessMeters.inc

[GPUGraphMeterInclude]
@Include11=#@#Modules\GPU\GraphMeters.inc

[MeterOptions]
Meter=Shape
X=(#ContentX#+#ContentWidth#-18*#Scale#)
Y=(#TitleRowCenterY#-9*#Scale#)
W=(18*#Scale#)
H=(18*#Scale#)
; Original eight-tooth gear; hidden meters have no mouse hit target.
Shape=Path GearPath | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Ellipse (9*#Scale#),(9*#Scale#),(2.5*#Scale#),(2.5*#Scale#) | Fill Color #BackgroundColor# | StrokeWidth 0
GearPath=(9.000*#Scale#),(3.300*#Scale#) | LineTo (10.444*#Scale#),(1.742*#Scale#) | LineTo (11.832*#Scale#),(2.163*#Scale#) | LineTo (12.167*#Scale#),(4.261*#Scale#) | LineTo (13.031*#Scale#),(4.969*#Scale#) | LineTo (15.153*#Scale#),(4.889*#Scale#) | LineTo (15.837*#Scale#),(6.168*#Scale#) | LineTo (14.590*#Scale#),(7.888*#Scale#) | LineTo (14.700*#Scale#),(9.000*#Scale#) | LineTo (16.258*#Scale#),(10.444*#Scale#) | LineTo (15.837*#Scale#),(11.832*#Scale#) | LineTo (13.739*#Scale#),(12.167*#Scale#) | LineTo (13.031*#Scale#),(13.031*#Scale#) | LineTo (13.111*#Scale#),(15.153*#Scale#) | LineTo (11.832*#Scale#),(15.837*#Scale#) | LineTo (10.112*#Scale#),(14.590*#Scale#) | LineTo (9.000*#Scale#),(14.700*#Scale#) | LineTo (7.556*#Scale#),(16.258*#Scale#) | LineTo (6.168*#Scale#),(15.837*#Scale#) | LineTo (5.833*#Scale#),(13.739*#Scale#) | LineTo (4.969*#Scale#),(13.031*#Scale#) | LineTo (2.847*#Scale#),(13.111*#Scale#) | LineTo (2.163*#Scale#),(11.832*#Scale#) | LineTo (3.410*#Scale#),(10.112*#Scale#) | LineTo (3.300*#Scale#),(9.000*#Scale#) | LineTo (1.742*#Scale#),(7.556*#Scale#) | LineTo (2.163*#Scale#),(6.168*#Scale#) | LineTo (4.261*#Scale#),(5.833*#Scale#) | LineTo (4.969*#Scale#),(4.969*#Scale#) | LineTo (4.889*#Scale#),(2.847*#Scale#) | LineTo (6.168*#Scale#),(2.163*#Scale#) | LineTo (7.888*#Scale#),(3.410*#Scale#) | ClosePath 1
Hidden=1
UpdateDivider=-1
MouseActionCursor=1
LeftMouseUpAction=[!ActivateConfig "Parallax\GPU\Settings" "Settings.ini"]
ToolTipText=Open the separate GPU Settings utility.
