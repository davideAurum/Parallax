[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
Group=Parallax
MouseActionCursor=0
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Advanced GPU options
ContextAction2=["notepad.exe" "#@#User\GPU.inc"]

[Metadata]
Name=Parallax GPU Settings
Author=Parallax contributors
Information=Independent GPU layout and HWiNFO sensor mapping controls. Changes persist only to GPU options.
Version=0.1.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\GPU.inc
; This utility has its own dimensions. Settings.lua reads the meter's saved
; Columns and PanelHeight directly without writing or overriding them on open.
Columns=2
PanelHeight=422
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc

[MeasureGPUDiscover]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Modules\GPU\
Parameter=-NoLogo -NoProfile -NonInteractive -Command "& ([ScriptBlock]::Create([IO.File]::ReadAllText('DiscoverExports.ps1.txt')))"
State=Hide
OutputType=UTF8
Timeout=10000
UpdateDivider=1
FinishAction=[!UpdateMeasure MeasureGPUDiscover][!CommandMeasure MeasureGPUSettings "FinishDiscovery()"]
; Only Browse/Rescan launches this fixed, one-shot source helper. Normal
; updates inspect cached completion, with no registry/process polling.

[MeasureGPUSettings]
Measure=Script
ScriptFile=#@#Modules\GPU\Settings.lua
UpdateDivider=-1

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[GPUSettingsMeterInclude]
@Include6=#@#Modules\GPU\SettingsMeters.inc
