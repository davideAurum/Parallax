[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=Parallax|ParallaxIO
MouseActionCursor=0
MouseOverAction=[!HideMeter MeterIOTotal][!ShowMeter MeterIOOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterIOOptions][!ShowMeter MeterIOTotal][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Drive I/O settings
ContextAction2=[!ActivateConfig "Parallax\IO\Settings" "Settings.ini"]
ContextTitle3=Disable disk transfer counters
ContextAction3=[!ActivateConfig "Parallax\IO" "IO.ini"]
ContextTitle4=Edit advanced IO options
ContextAction4=["notepad.exe" "#@#User\IO.inc"]

[Metadata]
Name=Parallax Drive I/O with disk counters
Author=Parallax contributors
Information=Optional UsageMonitor disk-category worker. Zero and freshness are ambiguous.
Version=0.1.0-dev

[Variables]
IODiskProvider=1
IODiskReadSource=MeasureIODiskRead
IODiskWriteSource=MeasureIODiskWrite
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\IO.inc
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\IO\Native.inc
@Include7=#@#Modules\IO\Disk.inc
@Include8=#@#Modules\IO\View.inc
