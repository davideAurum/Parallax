[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=Parallax|ParallaxIO
MouseActionCursor=0
; Empty unless Global Settings Idle pause is on (@Resources\Idle\Hook<n>.inc).
OnRefreshAction=#ParallaxIdleJoinAction#
MouseOverAction=[!HideMeter MeterIOTotal][!ShowMeter MeterIOOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterIOOptions][!ShowMeter MeterIOTotal][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Disk Meter settings
ContextAction2=[!ActivateConfig "Parallax\IO\Settings" "Settings.ini"]
ContextTitle3=Edit advanced Disk Meter options
ContextAction3=["notepad.exe" "#@#User\IO.inc"]

[Metadata]
Name=Parallax Disk Meter
Author=Parallax contributors
Information=Selected drive capacity and disk activity with one configurable history graph. UsageMonitor zero and freshness remain ambiguous.
Version=0.1.0-dev

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\IO.inc
IONameFinishAction=[!CommandMeasure MeasureIO "NamesReady()"]
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\IO\Inventory.inc
@Include7=#@#Modules\IO\Native.inc
@Include8=#@#Modules\IO\Disk.inc
@Include11=#@#Modules\IO\Model.inc
@Include9=#@#Modules\IO\View.inc
; Idle stand-down (Global Settings Idle pause; @Resources\Idle\Hook.inc, last
; section). IO.lua re-applies every drive row's divider on resume; the disk
; history shows the paused time as a gap. The "Paused (idle)" line covers the
; title row after the icon, over the headline total.
ParallaxIdleControllers=MeasureIO
ParallaxIdleHookDivider=(Max(1,Round(#ParallaxIdleHookMs#/1000)))
ParallaxPausedX=(#ContentX#+#ContentWidth#)
ParallaxPausedY=#TitleRowCenterY#
ParallaxPausedW=(#ContentWidth#-#TitleIconSize#-#TitleIconGap#)
ParallaxPausedH=#TitleRowHeight#
ParallaxPausedAlign=RightCenter

; Idle stand-down hook, last so its "Paused (idle)" line draws on top. Off
; (IdlePauseMinutes=0) loads a comment-only file (@Resources\Idle\Hook0.inc).
[ParallaxIdleHookInclude]
@Include99=#@#Idle\Hook#IdlePauseMinutes#.inc
