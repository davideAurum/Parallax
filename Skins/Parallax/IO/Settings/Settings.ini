[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
MouseActionCursor=0
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit Drive I/O options
ContextAction2=["notepad.exe" "#@#User\IO.inc"]

[Metadata]
Name=Parallax Drive I/O Settings
Author=Parallax contributors
Information=Independent drive capacity and optional disk-counter controls. Changes persist only to IO options.
Version=0.1.0-dev

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\IO.inc
; This utility has its own geometry, independent of the Drive I/O display.
Columns=2
PanelHeight=326
IOSettingsCellW=((#ContentWidth#-16*#Scale#)/2)
IOSettingsRightX=(#ContentX#+#IOSettingsCellW#+16*#Scale#)
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc

[MeasureIOSettings]
Measure=Script
ScriptFile=#@#Modules\IO\Settings.lua

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[IOSettingsMeterInclude]
@Include6=#@#Modules\IO\SettingsMeters.inc
