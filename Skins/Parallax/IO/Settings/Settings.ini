[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
MouseActionCursor=0
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit Disk Meter options
ContextAction2=["notepad.exe" "#@#User\IO.inc"]

[Metadata]
Name=Parallax Disk Meter Settings
Author=Parallax contributors
Information=Independent drive selection, capacity and disk history controls. Changes persist only to Disk Meter options.
Version=0.1.0-dev

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\IO.inc
; This utility has its own geometry, independent of the Disk Meter display.
Columns=2
PanelHeight=494
SettingsUtilityName=Disk Meter
IONameFinishAction=[!CommandMeasure MeasureIOSettings "NamesReady()"]
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc

[IOSettingsInventoryInclude]
@Include8=#@#Modules\IO\Inventory.inc
@Include9=#@#Modules\IO\Model.inc

[MeasureIOSettings]
Measure=Script
ScriptFile=#@#Modules\IO\Settings.lua

; Run only when the user opens the numeric cap editor. Input is fixed-protocol data.
[MeasureIOSettingsNumberInput]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Scripts\
Parameter=-NoProfile -NonInteractive -STA -WindowStyle Hidden -ExecutionPolicy RemoteSigned -File "SettingsInput.ps1" -Cancel
State=Hide
OutputType=UTF8
Timeout=300000
UpdateDivider=-1
FinishAction=[!UpdateMeasure MeasureIOSettingsNumberInput][!CommandMeasure MeasureIOSettings "FinishLimitInput()"]

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel
DynamicVariables=1

[IOSettingsNoteInclude]
@Include7=#@#UtilitySettingsNote.inc

[IOSettingsMeterInclude]
@Include6=#@#Modules\IO\SettingsMeters.inc
