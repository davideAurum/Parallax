; Parallax\Idle: the suite's input-idle coordinator. Not a utility and not a
; Welcome row. A Parallax skin that needs to know whether you are at the
; computer starts this config (@Resources\Idle\Link.lua); it unloads itself
; when nothing needs it. It holds the suite's only SysInfo IDLE_TIME measure:
; Rainmeter reads the network interface table before every update of a skin
; with any SysInfo measure, and for every !UpdateMeasure of one, so the signal
; lives here instead of in every skin (docs/PERFORMANCE-REVIEW.md T6,
; docs/ARCHITECTURE.md).
[Rainmeter]
; Never updated by Rainmeter after the load: Coordinator.lua ticks every
; ParallaxIdleTickMs through its own [!Delay] chain and updates the SysInfo
; measure only when a reading could change the idle state (every tick while
; away or paused, otherwise about once a minute).
Update=-1
Group=Parallax | ParallaxIdleCoordinator
; First load only (Rainmeter writes these into its settings for this config):
; hidden, click-through and fixed. The window is also a single transparent
; pixel, so it stays invisible if someone shows it.
DefaultStartHidden=1
DefaultClickThrough=1
DefaultDraggable=0
DefaultKeepOnScreen=0
DefaultWindowX=0
DefaultWindowY=0
OnRefreshAction=[!CommandMeasure MeasureParallaxIdle "Start()"]
OnCloseAction=[!CommandMeasure MeasureParallaxIdle "Closing()"]

[Metadata]
Name=Parallax Idle
Author=Parallax contributors
Information=Hidden coordinator: watches Windows input-idle time for the Parallax skins that ask for it (every 2 seconds while you are away, about once a minute while you are at the computer), and unloads itself when none does. Shows nothing.
Version=0.1.0

[Variables]
; Milliseconds between coordinator ticks. A hand edit in User\Settings.inc is
; clamped to 500-10000 below.
ParallaxIdleTick=2000
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
ParallaxIdleTickMs=(Max(500,Min(10000,#ParallaxIdleTick#)))
; Test hooks, empty in the shipped file and honoured only inside their bounds
; (Coordinator.lua). Test harnesses set them in staged copies only.
ParallaxIdleTestFile=
ParallaxIdleTestAwaySeconds=
ParallaxIdleTestPauseSeconds=
ParallaxIdleTestReevaluateTicks=
ParallaxIdleTestHeartbeatTicks=

; GetLastInputInfo: seconds since the last keyboard or mouse input in this
; session. Gamepads, touch-free media playback and remote tools may not count.
; Updated by Coordinator.lua (!UpdateMeasure) only when it reads.
[MeasureParallaxIdleRaw]
Measure=SysInfo
SysInfoType=IDLE_TIME

[MeasureParallaxIdle]
Measure=Script
ScriptFile=#@#Idle\Coordinator.lua

; Silent request targets. A consumer sends !UpdateMeasureGroup <group> * :
; only this config has a measure in these groups, so the request does nothing
; (and logs nothing) while the coordinator is not loaded. Both run once during
; the load as well, before Start(), where the script ignores them.
[MeasureParallaxIdleSyncRequest]
Measure=Calc
Formula=0
Group=ParallaxIdleSyncRequest
UpdateDivider=-1
OnUpdateAction=[!CommandMeasure MeasureParallaxIdle "Sync()"]

[MeasureParallaxIdleReevaluateRequest]
Measure=Calc
Formula=0
Group=ParallaxIdleReevaluateRequest
UpdateDivider=-1
OnUpdateAction=[!CommandMeasure MeasureParallaxIdle "RequestReevaluate()"]

; A skin needs a meter. One transparent pixel, never updated after the load,
; so this config never repaints.
[MeterParallaxIdleAnchor]
Meter=Image
X=0
Y=0
W=1
H=1
SolidColor=0,0,0,0
UpdateDivider=-1
