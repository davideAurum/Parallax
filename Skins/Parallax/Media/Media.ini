[Rainmeter]
; 50 ms while the title icon can animate or the spectrum drawer is open,
; otherwise MediaInterval (InlineQueueGeometry.inc).
Update=#MediaTickInterval#
; Rainmeter repaints the whole window whenever any meter's divider elapses, so
; a section without its own UpdateDivider follows the 1-second provider
; cadence instead of every animation tick (docs/PERFORMANCE-REVIEW.md
; MEDIA-01). This also applies to measures, so every measure states its own
; divider (MeasureMediaPulse: one animation frame, #MediaPulseDivider#).
DefaultUpdateDivider=#MediaLegacyDivider#
AccurateText=1
DynamicWindowSize=1
Group=Parallax
; ParallaxIdleJoinAction is empty unless the open drawer's capture lease is
; loaded (Modules\Media\DrawerCapture<n>.inc): then a delayed join of the
; Parallax\Idle input-idle coordinator.
OnRefreshAction=[!CommandMeasure MeasureMediaLifecycle "ResumeProviders()"]#ParallaxIdleJoinAction#
; A lease stamp (MEDIA-08) covers only reloads in this load's lifetime.
OnCloseAction=[!WriteKeyValue Variables MediaLeaseRefreshAt 0 "#@#Modules\Media\CaptureState.inc"]
; The open spectrum drawer shows the output volume in the gear's spot
; (group MediaHeaderValue, DrawerCapture<n>.inc); hover swaps it for the gear.
MouseOverAction=[!HideMeterGroup MediaHeaderValue][!ShowMeter MeterMediaOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterMediaOptions][!ShowMeterGroup MediaHeaderValue]#ParallaxIdleHoverAction#[!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Media: standard width
ContextAction2=[!WriteKeyValue "Variables" "Columns" "1" "#@#User\Media.inc"][!Refresh]
ContextTitle3=Media: double width
ContextAction3=[!WriteKeyValue "Variables" "Columns" "2" "#@#User\Media.inc"][!Refresh]
ContextTitle4=Media setup / unload provider
ContextAction4=[!ActivateConfig "Parallax\Media" "Setup.ini"]
ContextTitle5=Media settings
ContextAction5=[!ActivateConfig "Parallax\Media\Settings" "Settings.ini"]
ContextTitle6=Audio settings (spectrum drawer)
ContextAction6=[!ActivateConfig "Parallax\Visualizer\Settings" "Settings.ini"]

[Metadata]
Name=Parallax Media
Author=Parallax contributors
Information=Optional WebNowPlaying player and a separate authenticated Spotify queue helper.
Version=0.1.0

[Variables]
QueueExpanded=0
QueueRowLimit=5
QueueShowDetails=1
QueuePollSeconds=30
VisualizerDrawer=1
MediaTitleAnimation=20
; Spectrum drawer capture state (runtime, Modules\Media\CaptureState.inc,
; read before InlineQueueGeometry.inc). These defaults apply if that file is
; missing or partial: live capture, no lease reload.
MediaDrawerCapture=0
MediaStandby=0
MediaLeaseRefreshAt=0
MediaLeaseRefreshClock=0
ParallaxIdleJoinAction=
; The open drawer's title-row volume (DrawerCapture<n>.inc sets these): a
; headline meter Idle pause hides, swapped with the gear on hover.
MediaIdleHeadlineVolume=
MediaIdleHoverSwap=
; This entrypoint hosts the spectrum drawer (InlineQueueGeometry.inc).
MediaVisualizerHost=1
; ...and the player, whose title icon can animate (InlineQueueGeometry.inc).
MediaPlayerHost=1
; Visualizer preferences drive the spectrum drawer. They are read FIRST, so
; Defaults.inc and User\Media.inc then restore Media's own Columns and
; PanelHeight. The HeightPresets include is named while PanelHeight still holds
; the Visualizer's Height preset; see Modules\Visualizer\Fallbacks.inc.
@Include9=#@#Modules\Visualizer\Fallbacks.inc
@Include10=#@#User\Visualizer.inc
@Include11=#@#Modules\Visualizer\HeightPresets\#PanelHeight#.inc
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Media.inc
@Include4=#@#Geometry.inc
@Include13=#@#Modules\Visualizer\Options.inc
@Include14=#@#Modules\Media\CaptureState.inc
@Include12=#@#Modules\Media\InlineQueueGeometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\Media\Common.inc
@Include7=#@#Modules\Media\WebNowPlaying.inc
@Include8=#@#Modules\Media\PlayerMeters.inc
@Include17=#@#Modules\Media\Lifecycle.inc
@Include18=#@#Modules\Media\Queue\QueueControlHost.inc
; The open spectrum drawer, or a comment-only stub while it is closed or
; hidden, so no AudioLevel capture exists then.
@Include20=#@#Modules\Media\VisualizerDrawer#VisualizerDrawer#.inc
@Include16=#@#Modules\Media\Header.inc
; Idle stand-down (Global Settings Idle pause; @Resources\Idle\Hook.inc, last
; section). Media stands down by reloading: StandDown.lua asks MediaOptions
; (the single writer of Modules\Media\CaptureState.inc) for standby, which
; saves MediaStandby=1, parks an open drawer's capture and reloads once; the
; standby load ticks at the provider cadence and then freezes in place.
; Input reloads back. The "Paused (idle)" line takes the heading slot.
ParallaxIdleStandbyMode=refresh
ParallaxIdleStandbyWriter=MeasureMediaOptions
ParallaxIdleStandbyState=#MediaStandby#
ParallaxIdleControllers=
ParallaxIdleHeadline=MeterHeading#MediaIdleHeadlineVolume#
ParallaxIdleHoverSwap=#MediaIdleHoverSwap#
ParallaxIdleHookDivider=(Max(1,Round(#ParallaxIdleHookMs#/#MediaTickInterval#)))
ParallaxPausedX=(#ContentX#+#TitleIconSize#+#TitleIconGap#)
ParallaxPausedY=(#MediaHeaderY#+#TitleRowCenterY#-#Inset#)
ParallaxPausedW=#MediaHeadingWidth#
ParallaxPausedH=#TitleRowHeight#
ParallaxPausedAlign=LeftCenter
; Developer copy status icon (@Resources\Dev\Hook1.inc): this utility and the title
; meter the icon follows. Unused in a release.
ParallaxDevModule=Media
ParallaxDevTitle=MeterHeading
ParallaxDevTitleMeasure=MeasureMediaHeader

; Developer copy (Global Settings > Developer mode). A release loads a comment-only
; file (@Resources\Dev\Hook0.inc); the copy's Hook1.inc adds a status icon after the
; title, using the two variables above. Before the update and idle hooks.
[ParallaxDevHookInclude]
@Include97=#@#Dev\Hook#ParallaxDevBuild#.inc

; Automatic update check (Global Settings > Updates). Daily (UpdateCheck=1)
; loads the background check (@Resources\Update\Hook1.inc); Off loads a
; comment-only file.
[ParallaxUpdateHookInclude]
@Include98=#@#Update\Hook#UpdateCheck#.inc

; Idle stand-down hook, last so its "Paused (idle)" line draws on top. Off
; (IdlePauseMinutes=0) loads a comment-only file (@Resources\Idle\Hook0.inc).
[ParallaxIdleHookInclude]
@Include99=#@#Idle\Hook#IdlePauseMinutes#.inc
