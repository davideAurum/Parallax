[Rainmeter]
Update=#MediaAnimationInterval#
AccurateText=1
DynamicWindowSize=1
Group=Parallax
OnRefreshAction=[!CommandMeasure MeasureMediaLifecycle "ResumeProviders()"]
MouseOverAction=[!ShowMeter MeterMediaOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterMediaOptions][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Media: standard width
ContextAction2=[!WriteKeyValue "Variables" "Columns" "1" "#@#User\Media.inc"][!Refresh]
ContextTitle3=Media: double width
ContextAction3=[!WriteKeyValue "Variables" "Columns" "2" "#@#User\Media.inc"][!Refresh]
ContextTitle4=Media setup / unload provider
ContextAction4=[!ActivateConfig "Parallax\Media" "Setup.ini"]
ContextTitle5=Media settings
ContextAction5=[!ActivateConfig "Parallax\Media\Settings" "Settings.ini"]
ContextTitle6=Audio settings (spectrum drawer)
ContextAction6=[!ActivateConfig "Parallax\Visualizer\Settings" "Settings.ini"]

[Metadata]
Name=Parallax Media
Author=Parallax contributors
Information=Optional WebNowPlaying player and a separate authenticated Spotify queue helper.
Version=0.1.0

[Variables]
QueueExpanded=0
QueueRowLimit=5
QueueShowDetails=1
QueuePollSeconds=30
VisualizerDrawer=1
; This entrypoint hosts the spectrum drawer (InlineQueueGeometry.inc).
MediaVisualizerHost=1
; Visualizer preferences drive the spectrum drawer. They are read FIRST, so
; Defaults.inc and User\Media.inc then restore Media's own Columns and
; PanelHeight. The HeightPresets include is named while PanelHeight still holds
; the Visualizer's Height preset; see Modules\Visualizer\Fallbacks.inc.
@Include9=#@#Modules\Visualizer\Fallbacks.inc
@Include10=#@#User\Visualizer.inc
@Include11=#@#Modules\Visualizer\HeightPresets\#PanelHeight#.inc
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Media.inc
@Include4=#@#Geometry.inc
@Include13=#@#Modules\Visualizer\Options.inc
@Include12=#@#Modules\Media\InlineQueueGeometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\Media\Common.inc
@Include7=#@#Modules\Media\WebNowPlaying.inc
@Include8=#@#Modules\Media\PlayerMeters.inc
@Include17=#@#Modules\Media\Lifecycle.inc
; The open spectrum drawer, or a comment-only stub while it is closed or
; hidden, so no AudioLevel capture exists then.
@Include20=#@#Modules\Media\VisualizerDrawer#VisualizerDrawer#.inc
@Include16=#@#Modules\Media\Header.inc
