; Separately loadable read-only queue. Built-in Lua reads inert local snapshots.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=Parallax
; #ParallaxIdleJoinAction# is empty unless Global Settings Idle pause is on
; (@Resources\Idle\Hook<n>.inc).
OnRefreshAction=[!CommandMeasure MeasureMediaLifecycle "ResumeProviders()"]#ParallaxIdleJoinAction#
MouseOverAction=[!ShowMeter MeterMediaOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterMediaOptions][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Media: standard width
ContextAction2=[!WriteKeyValue "Variables" "Columns" "1" "#@#User\Media.inc"][!Refresh]
ContextTitle3=Media: double width
ContextAction3=[!WriteKeyValue "Variables" "Columns" "2" "#@#User\Media.inc"][!Refresh]
ContextTitle4=Disconnect Spotify and clear local tokens
ContextAction4=[!CommandMeasure MeasureQueueControl "Run('Disconnect')"]
ContextTitle5=Retry after resolving exhausted Spotify quota
ContextAction5=[!CommandMeasure MeasureQueueControl "Run('ResumeQuota')"]
ContextTitle6=Queue setup guide
ContextAction6=["#@#Modules\Media\Queue\README.md"]
ContextTitle7=Media settings
ContextAction7=[!ActivateConfig "Parallax\Media\Settings" "Settings.ini"]

[Metadata]
Name=Parallax Spotify Queue
Author=Parallax contributors
Information=Next five queued tracks or episodes from an opt-in Spotify PKCE helper. No fabricated or expired queue rows.
Version=0.2.0

[Variables]
QueueExpanded=0
QueueRowLimit=5
QueueShowDetails=1
QueuePollSeconds=30
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Media.inc
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\Media\Queue\QueueMeters.inc
MediaHeaderY=#Inset#
@Include7=#@#Modules\Media\HeaderGear.inc
@Include17=#@#Modules\Media\Lifecycle.inc
; Idle stand-down (Global Settings Idle pause; @Resources\Idle\Hook.inc, last
; section): the queue freezes in place; the "Paused (idle)" line takes the
; status line (the heading keeps its gear).
ParallaxIdleControllers=
ParallaxIdleHookDivider=(Max(1,Round(#ParallaxIdleHookMs#/1000)))
ParallaxPausedX=#ContentX#
ParallaxPausedY=(#Inset#+26*#Scale#)
ParallaxPausedW=#ContentWidth#
ParallaxPausedH=(18*#Scale#)
ParallaxPausedAlign=Left

[MeasureQueueStatus]
Measure=Script
Group=ParallaxIdlePause
ScriptFile=#@#Modules\Media\Queue\QueueReader.lua

[MeasureQueueControl]
Measure=Script
ScriptFile=#@#Modules\Media\Queue\QueueControl.lua
UpdateDivider=-1

[MeasureQueueProviderControl]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Modules\Media\Queue\
Parameter=-NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File "QueueProvider.ps1" -Command "Stop" -Quiet
State=Hide
OutputType=UTF8
Timeout=15000
UpdateDivider=-1
DynamicVariables=1

; Idle stand-down hook, last so its "Paused (idle)" line draws on top. Off
; (IdlePauseMinutes=0) loads a comment-only file (@Resources\Idle\Hook0.inc).
[ParallaxIdleHookInclude]
@Include99=#@#Idle\Hook#IdlePauseMinutes#.inc
