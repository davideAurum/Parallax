; Media preferences and explicit queue account / helper actions.
[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit Media options
ContextAction2=["#CONFIGEDITOR#" "#@#User\Media.inc"]

[Metadata]
Name=Parallax Media Settings
Author=Parallax contributors
Information=Media layout, queue display and explicit Spotify helper controls.
Version=0.2.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
Columns=1
QueueExpanded=0
QueueRowLimit=5
QueueShowDetails=1
QueuePollSeconds=30
@Include3=#@#User\Media.inc
; Start with safe collapsed geometry; Settings.lua validates saved visibility.
MediaSettingsQueueDetailsVisible=0
MediaSettingsQueueCollapsedHeight=(56*(1-#MediaSettingsQueueDetailsVisible#))
SettingsPanelHeight=(554-#MediaSettingsQueueCollapsedHeight#)
SettingsUtilityName=Media
@Include4=#@#Geometry.inc
; The menu always spans two pitches; Columns retains the Media preference.
WindowWidth=(2*#Pitch#)
PanelHeightPx=(Round(#SettingsPanelHeight#*#Scale#))
WindowHeight=(#PanelHeightPx#+#Gap#)
@Include5=#@#Styles.inc

[MeasureMediaSettings]
Measure=Script
ScriptFile=#@#Modules\Media\Settings.lua

; Executes only after an explicit numeric-field click. The fixed completion
; callback reads the result as data; input text never becomes a Rainmeter bang.
[MeasureMediaSettingsInput]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoProfile -NonInteractive
State=Hide
OutputType=UTF8
Timeout=300000
FinishAction=[!UpdateMeasure MeasureMediaSettingsInput][!CommandMeasure MeasureMediaSettings "CommitNumberInput()"]
UpdateDivider=-1
DynamicVariables=1

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds
Group=MediaSettingsData
DynamicVariables=1

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel
Group=MediaSettingsData
DynamicVariables=1

[MediaSettingsNoteInclude]
@Include6=#@#UtilitySettingsNote.inc

[MediaSettingsMeterInclude]
@Include7=#@#Modules\Media\SettingsMeters.inc
