; Media preferences and explicit queue account / helper actions.
[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit Media options
ContextAction2=["#CONFIGEDITOR#" "#@#User\Media.inc"]

[Metadata]
Name=Parallax Media Settings
Author=Parallax contributors
Information=Media layout, queue display and explicit Spotify helper controls.
Version=0.2.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
Columns=1
QueueExpanded=0
QueueRowLimit=5
QueueShowDetails=1
QueuePollSeconds=30
@Include3=#@#User\Media.inc
PanelHeight=360
@Include4=#@#Geometry.inc
; The menu always spans two pitches; Columns retains the Media preference.
WindowWidth=(2*#Pitch#)
@Include5=#@#Styles.inc

[MediaSettingsButton]
Group=MediaSettingsData
Padding=0,0,0,0
H=(22*#Scale#)
SolidColor=#GraphBackgroundColor#
StringAlign=LeftCenter
MouseActionCursor=1

[MediaSettingsCentered]
StringAlign=CenterCenter

[MeasureMediaSettings]
Measure=Script
ScriptFile=#@#Modules\Media\Settings.lua

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=(#ContentX#+#ContentWidth#/2)
Y=(#Inset#+6*#Scale#)
W=(#ContentWidth#-44*#Scale#)
H=(22*#Scale#)
StringAlign=Center
Text=Media settings

[MeterClose]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered|StyleSecondaryButton
X=(#ContentX#+#ContentWidth#-10*#Scale#)
Y=(#Inset#+15*#Scale#)
W=(20*#Scale#)
H=(18*#Scale#)
Text=X
ToolTipText=Close settings. Media and the Spotify queue helper keep running.
LeftMouseUpAction=[!DeactivateConfig]

[MeterWidthLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+37*#Scale#)
W=(114*#Scale#)
Text=Panel width

[MeterWidthValue]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton
X=(#ContentX#+122*#Scale#)
Y=(#Inset#+45*#Scale#)
W=(#ContentWidth#-122*#Scale#)
Text=1 column
ToolTipText=Switch Media and the separate queue panel between one and two columns.
LeftMouseUpAction=[!CommandMeasure MeasureMediaSettings "ToggleColumns()"]

[MeterQueueExpandedLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+63*#Scale#)
W=(114*#Scale#)
Text=Queue section

[MeterQueueExpandedValue]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton
X=(#ContentX#+122*#Scale#)
Y=(#Inset#+71*#Scale#)
W=(#ContentWidth#-122*#Scale#)
Text=Collapsed
ToolTipText=Expand or collapse the queue below the Media player. This does not start or stop its helper.
LeftMouseUpAction=[!CommandMeasure MeasureMediaSettings "ToggleQueueExpanded()"]

[MeterQueueRowsLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+89*#Scale#)
W=(114*#Scale#)
Text=Queue rows

[MeterQueueRowsValue]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton
X=(#ContentX#+122*#Scale#)
Y=(#Inset#+97*#Scale#)
W=(#ContentWidth#-122*#Scale#)
Text=5 items
ToolTipText=Cycle the maximum visible queue length: 1, 3 or 5 items. Spotify determines how many are available.
LeftMouseUpAction=[!CommandMeasure MeasureMediaSettings "CycleQueueRows()"]

[MeterQueueDetailsLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+115*#Scale#)
W=(114*#Scale#)
Text=Queue details

[MeterQueueDetailsValue]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton
X=(#ContentX#+122*#Scale#)
Y=(#Inset#+123*#Scale#)
W=(#ContentWidth#-122*#Scale#)
Text=Shown
ToolTipText=Show or hide artist and podcast details beside queue titles.
LeftMouseUpAction=[!CommandMeasure MeasureMediaSettings "ToggleQueueDetails()"]

[MeterQueuePollLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+141*#Scale#)
W=(114*#Scale#)
Text=Queue refresh

[MeterQueuePollValue]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton
X=(#ContentX#+122*#Scale#)
Y=(#Inset#+149*#Scale#)
W=(#ContentWidth#-122*#Scale#)
Text=30 seconds
ToolTipText=Cycle Spotify polling between 30, 60 and 120 seconds. Use Restart below to apply the saved interval.
LeftMouseUpAction=[!CommandMeasure MeasureMediaSettings "CycleQueuePoll()"]

[MeterSourceLabel]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+169*#Scale#)
W=(114*#Scale#)
Text=Source detection

[MeterSourceStart]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered
X=(#ContentX#+122*#Scale#+(#ContentWidth#-130*#Scale#)/4)
Y=(#Inset#+177*#Scale#)
W=((#ContentWidth#-130*#Scale#)/2)
Text=Start
ToolTipText=Start local Windows media-session detection to identify Spotify. No login is needed; this runs independently of the Spotify queue helper.
LeftMouseUpAction=["powershell.exe" "-NoLogo" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#Modules\Media\Source\SourceProvider.ps1" "-Command" "Start" "-Quiet"]

[MeterSourceStop]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered|StyleSecondaryButton
X=(#ContentX#+#ContentWidth#-(#ContentWidth#-130*#Scale#)/4)
Y=(#Inset#+177*#Scale#)
W=((#ContentWidth#-130*#Scale#)/2)
Text=Stop
ToolTipText=Stop local Windows source detection. This leaves playback, Spotify sign-in and the separate queue helper unchanged.
LeftMouseUpAction=["powershell.exe" "-NoLogo" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#Modules\Media\Source\SourceProvider.ps1" "-Command" "Stop" "-Quiet"]

[MeterStatus]
Meter=String
MeterStyle=StyleLabel
Group=MediaSettingsData
Y=(#Inset#+199*#Scale#)
H=(18*#Scale#)
Text=Changes save when clicked.

[MeterQueueRule]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+222*#Scale#)

[MeterQueueHeading]
Meter=String
MeterStyle=StyleHeader
Y=(#Inset#+232*#Scale#)
Text=Spotify queue

[MeterSignIn]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered
X=(#ContentX#+(#ContentWidth#-12*#Scale#)/6)
Y=(#Inset#+267*#Scale#)
W=((#ContentWidth#-12*#Scale#)/3)
Text=Sign in
ToolTipText=Open Spotify sign-in in your browser. A console guides setup if a public Client ID is needed.
LeftMouseUpAction=["powershell.exe" "-NoLogo" "-NoProfile" "-ExecutionPolicy" "Bypass" "-NoExit" "-File" "#@#Modules\Media\Queue\QueueProvider.ps1" "-Command" "Connect" "-PollSeconds" "#QueuePollSeconds#"]
DynamicVariables=1

[MeterStart]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered
X=(#ContentX#+#ContentWidth#/2)
Y=(#Inset#+267*#Scale#)
W=((#ContentWidth#-12*#Scale#)/3)
Text=Start
ToolTipText=Start the local queue helper with the saved interval. An existing helper keeps its current interval.
LeftMouseUpAction=["powershell.exe" "-NoLogo" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#Modules\Media\Queue\QueueProvider.ps1" "-Command" "Start" "-PollSeconds" "#QueuePollSeconds#" "-Quiet"]
DynamicVariables=1

[MeterStop]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered|StyleSecondaryButton
X=(#ContentX#+#ContentWidth#-(#ContentWidth#-12*#Scale#)/6)
Y=(#Inset#+267*#Scale#)
W=((#ContentWidth#-12*#Scale#)/3)
Text=Stop
ToolTipText=Stop queue polling and clear displayed queue data. Spotify sign-in is retained.
LeftMouseUpAction=["powershell.exe" "-NoLogo" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#Modules\Media\Queue\QueueProvider.ps1" "-Command" "Stop" "-Quiet"]

[MeterRestart]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered
X=(#ContentX#+(#ContentWidth#-8*#Scale#)/4)
Y=(#Inset#+294*#Scale#)
W=((#ContentWidth#-8*#Scale#)/2)
Text=Restart
ToolTipText=Restart the queue helper with the saved refresh interval. Existing Spotify rate limits remain in effect.
LeftMouseUpAction=["powershell.exe" "-NoLogo" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#Modules\Media\Queue\QueueProvider.ps1" "-Command" "Restart" "-PollSeconds" "#QueuePollSeconds#" "-Quiet"]
DynamicVariables=1

[MeterDisconnect]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered|StyleSecondaryButton
X=(#ContentX#+#ContentWidth#-(#ContentWidth#-8*#Scale#)/4)
Y=(#Inset#+294*#Scale#)
W=((#ContentWidth#-8*#Scale#)/2)
Text=Disconnect
ToolTipText=Stop the queue helper and delete this user's saved Spotify tokens. The public Client ID is retained.
LeftMouseUpAction=["powershell.exe" "-NoLogo" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "#@#Modules\Media\Queue\QueueProvider.ps1" "-Command" "Disconnect" "-Quiet"]

[MeterLinksRule]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+316*#Scale#)

[MeterOpenQueue]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered|StyleSecondaryButton
X=(#ContentX#+(#ContentWidth#-12*#Scale#)/6)
Y=(#Inset#+339*#Scale#)
W=((#ContentWidth#-12*#Scale#)/3)
Text=Open queue
ToolTipText=Open the separate queue panel. The expandable Media queue uses the same saved preferences.
LeftMouseUpAction=[!ActivateConfig "Parallax\Media\Queue" "Queue.ini"]

[MeterPlayerSetup]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered|StyleSecondaryButton
X=(#ContentX#+#ContentWidth#/2)
Y=(#Inset#+339*#Scale#)
W=((#ContentWidth#-12*#Scale#)/3)
Text=Player setup
ToolTipText=Open the plugin-free Media setup panel in place of the player.
LeftMouseUpAction=[!ActivateConfig "Parallax\Media" "Setup.ini"]

[MeterHelp]
Meter=String
MeterStyle=StyleButton|MediaSettingsButton|MediaSettingsCentered|StyleSecondaryButton
X=(#ContentX#+#ContentWidth#-(#ContentWidth#-12*#Scale#)/6)
Y=(#Inset#+339*#Scale#)
W=((#ContentWidth#-12*#Scale#)/3)
Text=Help
ToolTipText=Open the Spotify queue setup and troubleshooting guide.
LeftMouseUpAction=["#@#Modules\Media\Queue\README.md"]
