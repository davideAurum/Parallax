; Player-free entrypoint. Loading this variant unloads Media.ini's WNP measures.
; The only plugins left are Lifecycle.inc's inert hidden launch hosts, which
; hold no session and cannot run until a validated resume gives them a command.
[Rainmeter]
; MediaInterval: with no player and no drawer nothing here animates
; (MediaPlayerHost=0, MediaVisualizerHost=0; InlineQueueGeometry.inc).
Update=#MediaTickInterval#
AccurateText=1
DynamicWindowSize=1
Group=Parallax
; #ParallaxIdleJoinAction# is empty unless Global Settings Idle pause is on
; (@Resources\Idle\Hook<n>.inc).
OnRefreshAction=[!CommandMeasure MeasureMediaLifecycle "ResumeProviders()"]#ParallaxIdleJoinAction#
OnCloseAction=[!WriteKeyValue Variables MediaLeaseRefreshAt 0 "#@#Modules\Media\CaptureState.inc"]
MouseOverAction=[!ShowMeter MeterMediaOptions][!Redraw]
MouseLeaveAction=[!HideMeter MeterMediaOptions][!Redraw]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Media: standard width
ContextAction2=[!WriteKeyValue "Variables" "Columns" "1" "#@#User\Media.inc"][!Refresh]
ContextTitle3=Media: double width
ContextAction3=[!WriteKeyValue "Variables" "Columns" "2" "#@#User\Media.inc"][!Refresh]
ContextTitle4=Media settings
ContextAction4=[!ActivateConfig "Parallax\Media\Settings" "Settings.ini"]

[Metadata]
Name=Parallax Media Setup
Author=Parallax contributors
Information=Plugin-free onboarding. Queue status reads the optional helper cache; no authentication is started on load.
Version=0.1.0

[Variables]
QueueExpanded=0
QueueRowLimit=5
QueueShowDetails=1
QueuePollSeconds=30
VisualizerDrawer=1
MediaTitleAnimation=20
; Spectrum drawer capture state (runtime, Modules\Media\CaptureState.inc,
; read before InlineQueueGeometry.inc). These defaults apply if that file is
; missing or partial: live capture, no lease reload.
MediaDrawerCapture=0
MediaStandby=0
MediaLeaseRefreshAt=0
MediaLeaseRefreshClock=0
; No spectrum drawer here: no tab, no capture include and no lift. It must be
; set before the includes (see InlineQueueGeometry.inc). The panel keeps
; Media.ini's position, including the compact strip VisualizerDrawer reserves.
MediaVisualizerHost=0
; No player either, so no title animation: InlineQueueGeometry.inc then picks
; #MediaInterval# as the tick and MediaLegacyDivider is 1, leaving every shared
; measure in Common.inc and Header.inc on exactly the cadence it had before.
MediaPlayerHost=0
; Variable-only Visualizer defaults, so the shared geometry chain resolves;
; with no host its lift is never applied.
@Include9=#@#Modules\Visualizer\Fallbacks.inc
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Media.inc
@Include4=#@#Geometry.inc
@Include13=#@#Modules\Visualizer\Options.inc
@Include14=#@#Modules\Media\CaptureState.inc
@Include12=#@#Modules\Media\InlineQueueGeometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\Media\Common.inc
@Include7=#@#Modules\Media\SetupMeters.inc
@Include17=#@#Modules\Media\Lifecycle.inc
@Include16=#@#Modules\Media\Header.inc
; Idle stand-down (Global Settings Idle pause; @Resources\Idle\Hook.inc, last
; section): Setup freezes in place (no player, no drawer, nothing to reload);
; the "Paused (idle)" line takes the heading slot.
ParallaxIdleControllers=
ParallaxIdleHookDivider=(Max(1,Round(#ParallaxIdleHookMs#/#MediaTickInterval#)))
ParallaxPausedX=(#ContentX#+#TitleIconSize#+#TitleIconGap#)
ParallaxPausedY=(#MediaHeaderY#+#TitleRowCenterY#-#Inset#)
ParallaxPausedW=#MediaHeadingWidth#
ParallaxPausedH=#TitleRowHeight#
ParallaxPausedAlign=LeftCenter
; No queue in this entrypoint, so no drawer and no notch cut in the panel.
MediaQueueDrawer=0

; Idle stand-down hook, last so its "Paused (idle)" line draws on top. Off
; (IdlePauseMinutes=0) loads a comment-only file (@Resources\Idle\Hook0.inc).
[ParallaxIdleHookInclude]
@Include99=#@#Idle\Hook#IdlePauseMinutes#.inc
