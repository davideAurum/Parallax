[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit Network settings
ContextAction2=["notepad.exe" "#@#User\Network.inc"]
ContextTitle3=Show Network traffic
ContextAction3=[!ActivateConfig "Parallax\Network" "Network.ini"]
ContextTitle4=Windows Wi-Fi settings
ContextAction4=["ms-settings:network-wifi"]

[Metadata]
Name=Parallax Connection
Author=Parallax contributors
Information=Adapter and PC Internet status, local addressing, link speeds, and reported Wi-Fi signal.
Version=0.1.0-dev

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Network.inc
; Independent companion choices, translated to shared geometry before it loads.
Columns=#NetworkConnectionColumns#
PanelHeight=#NetworkConnectionHeight#
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\Network\ConnectionMeasures.inc
@Include7=#@#Modules\Network\ConnectionMeters.inc
