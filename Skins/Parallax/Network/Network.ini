[Rainmeter]
; Native NIC counters require one-second sampling, including Economy mode.
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit Network settings
ContextAction2=["notepad.exe" "#@#User\Network.inc"]
ContextTitle3=Show Connection information
ContextAction3=[!ActivateConfig "Parallax\Network\Connection" "Connection.ini"]

[Metadata]
Name=Parallax Network
Author=Parallax contributors
Information=Selected NIC inbound/outbound rates and recent history. Includes LAN traffic.
Version=0.1.0-dev

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Network.inc
; Extra text space comes from the two histories, preserving the saved panel height.
NetworkTitleExtra=(Max(0,Max(#TitleFontSize#-10,Max(#FontSize#,#HeaderFontSize#)-9))*2)
NetworkRowExtra=(Max(0,Max(#FontSize#,#HeaderFontSize#)-9)*2)
NetworkGraphHeight=(40-#NetworkTitleExtra#/2-3*#NetworkRowExtra#)
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\Network\Measures.inc
@Include7=#@#Modules\Network\Meters.inc
