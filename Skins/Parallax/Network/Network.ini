[Rainmeter]
; Native NIC counters require one-second sampling, including Economy mode.
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=Parallax
; Empty unless Global Settings Idle pause is on (@Resources\Idle\Hook<n>.inc).
OnRefreshAction=#ParallaxIdleJoinAction#
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Network settings
ContextAction2=[!ActivateConfig "Parallax\Network\Settings" "Settings.ini"]
ContextTitle3=Windows Wi-Fi settings
ContextAction3=["ms-settings:network-wifi"]
ContextTitle4=Edit Network settings file
ContextAction4=["notepad.exe" "#@#User\Network.inc"]

[Metadata]
Name=Parallax Network
Author=Parallax contributors
Information=Adapter and PC Internet status, Wi-Fi signal, selected NIC rates and histories. Includes LAN traffic.
Version=0.1.0-dev

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Network.inc
; One header, connection details and two traffic histories share this utility.
NetworkRowExtra=(Max(0,Max(#FontSize#,#HeaderFontSize#)-9)*2)
NetworkGraphHeight=42
@Include4=#@#Geometry.inc
; Preserve the saved minimum. Only derived geometry grows to fit combined content.
PanelHeightPx=(Max(Round(#PanelHeight#*#Scale#),Round(464*#Scale#)+#DataBarThicknessPx#))
@Include5=#@#Styles.inc
@Include6=#@#Modules\Network\Measures.inc
@Include7=#@#Modules\Network\ConnectionMeasures.inc
@Include8=#@#Modules\Network\Meters.inc
@Include9=#@#Modules\Network\ConnectionMeters.inc
; Idle stand-down (Global Settings Idle pause; @Resources\Idle\Hook.inc, last
; section). No controller call is needed: Core.lua treats the paused time as a
; gap (history restarts, two samples read "sampling..."). The "Paused (idle)"
; line takes the hidden status line's place; the title row keeps its unit and
; width buttons.
ParallaxIdleControllers=
ParallaxIdleHeadline=MeterNetworkStatus
ParallaxIdleHookDivider=(Max(1,Round(#ParallaxIdleHookMs#/1000)))
ParallaxPausedX=#ContentX#
ParallaxPausedY=(#Inset#+246*#Scale#+#DataBarThicknessPx#)
ParallaxPausedW=#ContentWidth#
ParallaxPausedH=(18*#Scale#)
ParallaxPausedAlign=Left

; Idle stand-down hook, last so its "Paused (idle)" line draws on top. Off
; (IdlePauseMinutes=0) loads a comment-only file (@Resources\Idle\Hook0.inc).
[ParallaxIdleHookInclude]
@Include99=#@#Idle\Hook#IdlePauseMinutes#.inc
