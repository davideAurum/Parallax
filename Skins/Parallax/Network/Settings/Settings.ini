[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit Network settings file
ContextAction2=["notepad.exe" "#@#User\Network.inc"]

[Metadata]
Name=Parallax Network Settings
Author=Parallax contributors
Information=Independent settings for the combined Network utility. No telemetry collection.
Version=0.1.0-dev

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Network.inc
; This config's geometry never persists into the monitor's saved choices.
; Settings.lua reads those saved choices directly from the module user include.
Columns=2
PanelHeight=598
SettingsUtilityName=Network
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc

[MeasureNetworkSettings]
Measure=Script
ScriptFile=#@#Modules\Network\Settings.lua

[MeasureNetworkSettingsInput]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoProfile -NonInteractive
StartInFolder=#@#Scripts\
State=Hide
OutputType=UTF8
Timeout=300000
FinishAction=[!UpdateMeasure MeasureNetworkSettingsInput][!CommandMeasure MeasureNetworkSettings "FinishNumberInput()"]
UpdateDivider=-1
DynamicVariables=1

[MeterNetworkSettingsBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterNetworkSettingsPanel]
Meter=Shape
MeterStyle=StylePanel

[NetworkSettingsMeterIncludes]
@Include6=#@#UtilitySettingsNote.inc
@Include7=#@#Modules\Network\SettingsMeters.inc
