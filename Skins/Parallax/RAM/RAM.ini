[Rainmeter]
Update=#MetricsInterval#
AccurateText=1
DynamicWindowSize=1
Group=Parallax | ParallaxRAM
MouseActionCursor=0
; #ParallaxIdleJoinAction# is empty unless Global Settings Idle pause is on
; (@Resources\Idle\Hook<n>.inc).
OnRefreshAction=[!CommandMeasure MeasureRAMInfo "Run"][!CommandMeasure MeasureRAMPageView "Start()"]#ParallaxIdleJoinAction#
OnCloseAction=[!CommandMeasure MeasureRAMPageView "Stop()"]
MouseOverAction=[!CommandMeasure MeasureRAMSettings "Hover(1)"]
MouseLeaveAction=[!CommandMeasure MeasureRAMSettings "Hover(0)"]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit RAM options
ContextAction2=["notepad.exe" "#@#User\RAM.inc"]
ContextTitle3=RAM settings
ContextAction3=[!ActivateConfig "Parallax\RAM\Settings" "Settings.ini"]

[Metadata]
Name=Parallax RAM
Author=Parallax contributors
Information=Memory Meter: hardware overview, physical RAM and paging-file used/allocated capacity, top processes by private working set, and bottom RAM history. See docs/modules/RAM.md.
Version=0.1.0-dev

[Variables]
; Module fallbacks precede the persisted user include, including on upgrades.
RAMTitle=Memory Meter
; Transient overview height. The native wrapped summary sets its final size.
RAMInfoHeight=26
RAMUseMiB=0
RAMDecimals=1
RAMPercentDecimals=0
RAMShowBar=1
RAMShowPageBar=1
RAMShowHistory=1
; Also names the process-rank include (Modules\RAM\Measures.inc).
RAMShowProcesses=1
; Also names the history-scale include (Modules\RAM\Measures.inc).
RAMHistoryScale=0
RAMHistoryMinSpan=2
; The measure the history Line draws; Auto's include overrides it (transient).
RAMHistoryMeasure=MeasureRAMUsed
RAMHistoryEmptyColor=25,25,25
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\RAM.inc
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\RAM\Measures.inc
@Include7=#@#Modules\RAM\Meters.inc
@Include8=#@#Modules\RAM\InfoMeters.inc
@Include9=#@#Modules\RAM\ProcessMeters.inc
; Idle stand-down (Global Settings Idle pause; @Resources\Idle\Hook.inc, last
; section). PageFile.lua stops its host while paused; Display.lua re-applies
; the dividers it manages and restarts the history cover on resume. While
; paused the title and the headline percentage are hidden and "Paused (idle)"
; takes the title's place, left of the gear slot (it does not fit in the
; percentage slot alone); the gear still follows the hover, and Display.lua's
; Hover() keeps the frozen percentage hidden while paused.
ParallaxIdleControllers=MeasureRAMPageView|MeasureRAMSettings
ParallaxIdleHeadline=MeterRAMTitle|MeterRAMPercent
ParallaxIdleHoverSwap=MeterRAMOptions|MeterRAMPercent
ParallaxIdleHookDivider=(Max(1,Round(#ParallaxIdleHookMs#/#MetricsInterval#)))
ParallaxPausedX=(#ContentX#+#TitleIconSize#+#TitleIconGap#)
ParallaxPausedY=#TitleRowCenterY#
ParallaxPausedW=(#ContentWidth#-#TitleIconSize#-2*#TitleIconGap#-18*#Scale#)
ParallaxPausedH=#TitleRowHeight#
ParallaxPausedAlign=LeftCenter

; Idle stand-down hook, last so its "Paused (idle)" line draws on top. Off
; (IdlePauseMinutes=0) loads a comment-only file (@Resources\Idle\Hook0.inc).
[ParallaxIdleHookInclude]
@Include99=#@#Idle\Hook#IdlePauseMinutes#.inc
