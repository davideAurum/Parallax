[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
OnCloseAction=[!CommandMeasure MeasureRAMSettings "Close()"]
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Edit RAM options
ContextAction2=["notepad.exe" "#@#User\RAM.inc"]

[Metadata]
Name=Parallax RAM Settings
Author=Parallax contributors
Information=Independent RAM display controls. Changes apply immediately and persist in RAM options.
Version=0.1.0-dev

[Variables]
RAMUseMiB=0
RAMDecimals=1
RAMPercentDecimals=0
RAMShowBar=1
RAMShowPageBar=1
RAMShowHistory=1
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\RAM.inc
; Utility-only dimensions for the Global Settings-style layout. These never
; overwrite the RAM meter's saved Columns or PanelHeight preferences.
Columns=2
PanelHeight=340
SettingsUtilityName=RAM
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc

[MeasureRAMSettings]
Measure=Script
ScriptFile=#@#Modules\RAM\Settings.lua
UpdateDivider=-1

[MeasureRAMSettingsInput]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
StartInFolder=#@#Scripts\
Parameter=-NoLogo -NoProfile -NonInteractive
State=Hide
OutputType=UTF8
Timeout=300000
UpdateDivider=-1
DynamicVariables=1
FinishAction=[!UpdateMeasure MeasureRAMSettingsInput][!CommandMeasure MeasureRAMSettings "CompleteInput()"]

[MeterRAMSettingsBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterRAMSettingsPanel]
Meter=Shape
MeterStyle=StylePanel

[RAMSettingsNoteInclude]
@Include7=#@#UtilitySettingsNote.inc

[RAMSettingsMeterInclude]
@Include6=#@#Modules\RAM\SettingsMeters.inc
