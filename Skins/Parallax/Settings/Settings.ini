[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
MouseLeaveAction=[!CommandMeasure MeasureSettings "CloseThemeMenu()"]
ContextTitle=Edit global settings
ContextAction=["notepad.exe" "#@#User\Settings.inc"]
ContextTitle2=Open the Welcome panel
ContextAction2=[!ActivateConfig "Parallax\Welcome" "Welcome.ini"]

[Metadata]
Name=Global Settings
Author=Parallax
Information=Compact appearance, sizing and update controls for the Parallax suite.
Version=0.1.0-dev

[Variables]
@Include=#@#Defaults.inc
@Include2=#@#User\Settings.inc
Columns=2
PanelHeight=758
@Include3=#@#Geometry.inc
@Include4=#@#Styles.inc

[MeasureSettings]
Measure=Script
ScriptFile=#@#Scripts\Settings.lua

[MeasureSettingsInput]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoProfile -NonInteractive
State=Hide
OutputType=UTF8
Timeout=300000
FinishAction=[!UpdateMeasure MeasureSettingsInput][!CommandMeasure MeasureSettings "CommitInput()"]
UpdateDivider=-1
DynamicVariables=1

; Neutral editor text keeps the controls usable while editing suite text colors.
[StyleSettingsText]
FontSize=(9*#Scale#)
FontColor=220,220,220

[StyleSettingsHeader]
FontSize=(8*#Scale#)
FontColor=175,175,175

[StyleSettingsSection]
FontColor=#AccentColor#

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterIcon]
Meter=Shape
X=#ContentX#
Y=(#TitleRowCenterY#-#TitleIconSize#/2)
W=#TitleIconSize#
H=#TitleIconSize#
Shape=Rectangle 0,(0.5*#TitleIconScale#),(14*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Rectangle 0,(5.5*#TitleIconScale#),(10*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor2# | StrokeWidth 0
Shape3=Rectangle 0,(10.5*#TitleIconScale#),(14*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor# | StrokeWidth 0
AntiAlias=1
UpdateDivider=-1

[MeterTitle]
Meter=String
MeterStyle=StyleTitle|StyleTitleRow
X=(#ContentX#+#TitleIconSize#+#TitleIconGap#)
W=(#ContentWidth#-#TitleIconSize#-#TitleIconGap#-26*#Scale#)
