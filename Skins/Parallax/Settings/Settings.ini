[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
MouseLeaveAction=[!CommandMeasure MeasureSettings "CloseThemeMenu()"]
; Unloading destroys a pending debounced refresh timer; apply that change instead.
OnCloseAction=[!CommandMeasure MeasureSettings "FlushPending()"]
ContextTitle=Edit global settings
ContextAction=["notepad.exe" "#@#User\Settings.inc"]
ContextTitle2=Open the Welcome panel
ContextAction2=[!ActivateConfig "Parallax\Welcome" "Welcome.ini"]

[Metadata]
Name=Global Settings
Author=Parallax
Information=Compact appearance, sizing and update controls for the Parallax suite.
Version=0.1.0-dev

[Variables]
@Include=#@#Defaults.inc
@Include2=#@#User\Settings.inc
Columns=2
PanelHeight=997
@Include3=#@#Geometry.inc
@Include4=#@#Styles.inc
; Updates section: installed version, release feed, shared check state and
; the install helper (@Resources\Update).
@Include5=#@#Version.inc
ParallaxUpdateRole=settings
@Include6=#@#Update\Feed.inc
@Include7=#@#Update\Install.inc
; Developer section: the dev copy controller and its one-shot helper launcher (@Resources\Dev).
@Include8=#@#Dev\Panel.inc

[MeasureSettings]
Measure=Script
ScriptFile=#@#Scripts\Settings.lua

; Color swatches open the shared picker beside this panel.
[MeasureColorLauncher]
Measure=Script
ScriptFile=#@#Modules\ColorPicker\Launcher.lua

; Check now, Update and Notes, the status line, and one check as the panel
; opens when Auto check is Daily and no check started in the last 10 minutes.
; ParallaxUpdateView: re-renders when another Parallax skin records a check.
[MeasureParallaxUpdate]
Measure=Script
ScriptFile=#@#Update\Update.lua
Group=ParallaxUpdateView
UpdateDivider=-1

[MeasureSettingsInput]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoProfile -NonInteractive
State=Hide
OutputType=UTF8
Timeout=300000
FinishAction=[!UpdateMeasure MeasureSettingsInput][!CommandMeasure MeasureSettings "CommitInput()"]
UpdateDivider=-1
DynamicVariables=1

; Neutral editor text keeps the controls usable while editing suite text colors.
[StyleSettingsText]
FontSize=(9*#Scale#)
FontColor=220,220,220

[StyleSettingsHeader]
