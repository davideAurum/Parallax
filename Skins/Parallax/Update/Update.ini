[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
; ParallaxUpdatePrompt: the prompt's own group, for tests and later tools.
Group=Parallax | ParallaxUpdatePrompt
ContextTitle=Global settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]

[Metadata]
Name=Parallax Update
Author=Parallax
Information=Opened by the automatic update check when a newer Parallax release is published. Update downloads and verifies the package, then Rainmeter's Skin Installer asks before installing anything. Later closes the prompt and stops prompting for that version; Global Settings > Updates still offers it.
Version=0.1.0-dev

[Variables]
@Include=#@#Defaults.inc
@Include2=#@#User\Settings.inc
Columns=1
PanelHeight=134
@Include3=#@#Geometry.inc
@Include4=#@#Styles.inc
@Include5=#@#Version.inc
ParallaxUpdateRole=prompt
@Include6=#@#Update\Install.inc

; Reads the offer from @Resources\Update\State.inc; closes itself when there
; is nothing newer to offer. ParallaxUpdateView: re-renders when another
; Parallax skin records a check.
[MeasureParallaxUpdate]
Measure=Script
ScriptFile=#@#Update\Update.lua
Group=ParallaxUpdateView
UpdateDivider=-1

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterIcon]
Meter=Shape
X=#ContentX#
Y=(#TitleRowCenterY#-#TitleIconSize#/2)
W=#TitleIconSize#
H=#TitleIconSize#
Shape=Rectangle 0,(0.5*#TitleIconScale#),(14*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Rectangle 0,(5.5*#TitleIconScale#),(10*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor2# | StrokeWidth 0
Shape3=Rectangle 0,(10.5*#TitleIconScale#),(14*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor# | StrokeWidth 0
AntiAlias=1
UpdateDivider=-1

[MeterTitle]
Meter=String
MeterStyle=StyleTitle|StyleTitleRow
X=(#ContentX#+#TitleIconSize#+#TitleIconGap#)
W=(#ContentWidth#-#TitleIconSize#-#TitleIconGap#-26*#Scale#)
Text=Parallax update

[MeterHeadline]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+34*#Scale#)
Text=A new version is available
Group=ParallaxUpdateUI

[MeterInstalled]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+52*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
FontColor=#MutedColor#
Text=Installed: #ParallaxVersion#

[MeterUpdateInstall]
Meter=String
MeterStyle=StyleButton
X=(#ContentX#+0*(#ContentWidth#+4*#Scale#)/3)
Y=(#Inset#+76*#Scale#)
W=((#ContentWidth#-8*#Scale#)/3-6*#Scale#)
SolidColor=#TrackColor#
Text=Update
Group=ParallaxUpdateUI
LeftMouseUpAction=[!CommandMeasure MeasureParallaxUpdate "Install()"]

[MeterUpdateNotes]
Meter=String
MeterStyle=StyleButton|StyleSecondaryButton
X=(#ContentX#+1*(#ContentWidth#+4*#Scale#)/3)
Y=(#Inset#+76*#Scale#)
W=((#ContentWidth#-8*#Scale#)/3-6*#Scale#)
Text=Notes
Hidden=1
Group=ParallaxUpdateUI
LeftMouseUpAction=[!CommandMeasure MeasureParallaxUpdate "OpenNotes()"]

[MeterLater]
Meter=String
MeterStyle=StyleButton|StyleSecondaryButton
X=(#ContentX#+2*(#ContentWidth#+4*#Scale#)/3)
Y=(#Inset#+76*#Scale#)
W=((#ContentWidth#-8*#Scale#)/3-6*#Scale#)
Text=Later
LeftMouseUpAction=[!CommandMeasure MeasureParallaxUpdate "Later()"]

; Two lines, so the longest install result fits the single column.
[MeterUpdateStatus]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+102*#Scale#)
H=(26*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
FontColor=#MutedColor#
ClipString=2
Text=Skin Installer asks you to confirm.
Group=ParallaxUpdateUI

; X closes like Later.
[MeterClose]
Meter=Shape
X=(#ContentX#+#ContentWidth#-20*#Scale#)
Y=(#TitleRowCenterY#-10*#Scale#)
W=(20*#Scale#)
H=(20*#Scale#)
SolidColor=0,0,0,1
Shape=Line (5*#Scale#),(5*#Scale#),(15*#Scale#),(15*#Scale#) | Stroke Color #TextColor# | StrokeWidth (1.5*#Scale#)
Shape2=Line (15*#Scale#),(5*#Scale#),(5*#Scale#),(15*#Scale#) | Stroke Color #TextColor# | StrokeWidth (1.5*#Scale#)
LeftMouseUpAction=[!CommandMeasure MeasureParallaxUpdate "Later()"]
MouseActionCursor=1
UpdateDivider=-1
