[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Advanced Visualizer options
ContextAction2=["notepad.exe" "#@#User\Visualizer.inc"]

[Metadata]
Name=Parallax Audio Settings
Author=Parallax contributors
Information=Independent Visualizer controls. Choices save immediately; opening this panel starts no audio capture.
Version=0.1.0-dev

[Variables]
; Fallbacks let preserved user includes adopt newly introduced choices.
VisualizerQuality=1
VisualizerUpdateOverride=0
VisualizerBandGap=1
VisualizerColorMode=0
VisualizerSensitivity=35
VisualizerAttack=50
VisualizerDecay=250
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Visualizer.inc
SettingsUtilityName=Visualizer
@Include4=#@#Geometry.inc
; Retain imported Columns and PanelHeight so the selected spectrum width and
; height remain visible. Only these local derived dimensions size this utility;
; its two-column width and 344px height are never saved as spectrum preferences.
WindowWidth=(2*#Pitch#)
PanelWidth=(#WindowWidth#-#Gap#)
PanelHeightPx=(Round(344*#Scale#))
WindowHeight=(#PanelHeightPx#+#Gap#)
VisualizerSettingsColumnGap=(12*#Scale#)
VisualizerSettingsColumnWidth=((#ContentWidth#-#VisualizerSettingsColumnGap#)/2)
VisualizerSettingsValueWidth=(#VisualizerSettingsColumnWidth#-116*#Scale#)
VisualizerSettingsRightX=(#ContentX#+#VisualizerSettingsColumnWidth#+#VisualizerSettingsColumnGap#)
@Include5=#@#Styles.inc

[MeterVisualizerSettingsBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterVisualizerSettingsPanel]
Meter=Shape
MeterStyle=StylePanel

[VisualizerSettingsNoteInclude]
@Include6=#@#UtilitySettingsNote.inc

[VisualizerSettingsMeterInclude]
@Include7=#@#Modules\Visualizer\Settings.inc
