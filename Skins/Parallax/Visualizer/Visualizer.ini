[Rainmeter]
; Only this config uses the visualizer cadence. Capture settings apply on refresh.
; Stood down for the Global Settings Idle pause it ticks once a second
; (VisualizerTickMs, below).
Update=#VisualizerTickMs#
AccurateText=1
DynamicWindowSize=1
Group=Parallax
; One capture at a time (Modules\Visualizer\Companion.lua): 100 ms after each
; load, and after a real unload, ask Media's open drawer to re-check whether
; to defer to this skin. Both are silent group requests. Actions that name a
; section come from the variant (Modules\Visualizer\Standalone<n>.inc); the
; idle join is empty unless Global Settings Idle pause is on.
OnRefreshAction=#VisualizerRefreshAction#[!Delay 100][!CommandMeasure MeasureVisualizerCompanion "Announce()"]#ParallaxIdleJoinAction#
OnCloseAction=[!CommandMeasure MeasureVisualizerCompanion "Closing()"]
MouseActionCursor=0
MouseOverAction=#VisualizerHoverIn#
MouseLeaveAction=#VisualizerHoverOut#
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Visualizer options
ContextAction2=["notepad.exe" "#@#User\Visualizer.inc"]
ContextTitle3=Standard width
ContextAction3=[!WriteKeyValue Variables Columns 1 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle4=Double width
ContextAction4=[!WriteKeyValue Variables Columns 2 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle5=Quality: economy (512 FFT)
ContextAction5=[!WriteKeyValue Variables VisualizerQuality 0 "#@#User\Visualizer.inc"][!CommandMeasure MeasureMediaOptions "RefreshVisualizerDrawer()" "Parallax\Media"][!Refresh]
ContextTitle6=Quality: balanced (1024 FFT)
ContextAction6=[!WriteKeyValue Variables VisualizerQuality 1 "#@#User\Visualizer.inc"][!CommandMeasure MeasureMediaOptions "RefreshVisualizerDrawer()" "Parallax\Media"][!Refresh]
ContextTitle7=Quality: detailed (2048 FFT)
ContextAction7=[!WriteKeyValue Variables VisualizerQuality 2 "#@#User\Visualizer.inc"][!CommandMeasure MeasureMediaOptions "RefreshVisualizerDrawer()" "Parallax\Media"][!Refresh]
ContextTitle8=Cadence: follow suite setting
ContextAction8=[!WriteKeyValue Variables VisualizerUpdateOverride 0 "#@#User\Visualizer.inc"][!CommandMeasure MeasureMediaOptions "RefreshVisualizerDrawer()" "Parallax\Media"][!Refresh]
ContextTitle9=Cadence: 33 ms (about 30 FPS)
ContextAction9=[!WriteKeyValue Variables VisualizerUpdateOverride 33 "#@#User\Visualizer.inc"][!CommandMeasure MeasureMediaOptions "RefreshVisualizerDrawer()" "Parallax\Media"][!Refresh]
ContextTitle10=Cadence: 50 ms (20 FPS)
ContextAction10=[!WriteKeyValue Variables VisualizerUpdateOverride 50 "#@#User\Visualizer.inc"][!CommandMeasure MeasureMediaOptions "RefreshVisualizerDrawer()" "Parallax\Media"][!Refresh]
ContextTitle11=Cadence: 100 ms (10 FPS)
ContextAction11=[!WriteKeyValue Variables VisualizerUpdateOverride 100 "#@#User\Visualizer.inc"][!CommandMeasure MeasureMediaOptions "RefreshVisualizerDrawer()" "Parallax\Media"][!Refresh]
ContextTitle12=Reconnect output device
ContextAction12=[!Refresh]
ContextTitle13=Stop capture / unload Visualizer
ContextAction13=[!DeactivateConfig]
ContextTitle14=Audio settings
ContextAction14=[!ActivateConfig "Parallax\Visualizer\Settings" "Settings.ini"]

[Metadata]
Name=Parallax Visualizer
Author=Parallax contributors
Information=Output-device spectrum using Rainmeter AudioLevel. Mixed output audio; no audio processing.
Version=0.1.0

[Variables]
; Idle stand-down defaults (runtime state, Modules\Visualizer\StandbyState.inc):
; these apply if that file is missing or partial: live capture.
VisualizerStandby=0
ParallaxIdleJoinAction=
; Upgrade fallbacks first; the user's module include retains precedence.
; Media's spectrum drawer shares Fallbacks, Options, Capture and Spectrum.
@Include9=#@#Modules\Visualizer\Fallbacks.inc
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Visualizer.inc
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include10=#@#Modules\Visualizer\Options.inc
@Include13=#@#Modules\Visualizer\StandbyState.inc
VisualizerTickMs=(#VisualizerStandby#=1 ? 1000 : #VisualizerEffectiveInterval#)
@Include6=#@#Modules\Visualizer\Config.inc
; Live: capture, output row, frame and spectrum (Standalone0.inc). Stood down
; for the idle pause: the frame and "Paused (idle)", no capture (Standalone1.inc).
@Include11=#@#Modules\Visualizer\Standalone#VisualizerStandby#.inc
; Idle stand-down (Global Settings Idle pause; @Resources\Idle\Hook.inc, last
; section): the standalone stands down by reloading into Standalone1.inc
; through Companion.lua's single writer, then freezes in place; input
; reloads it live. The "Paused (idle)" line takes the plot's overlay slot.
ParallaxIdleStandbyMode=refresh
ParallaxIdleStandbyWriter=MeasureVisualizerCompanion
ParallaxIdleStandbyState=#VisualizerStandby#
ParallaxIdleControllers=
ParallaxIdleHeadline=MeterVisualizerUnavailable
ParallaxIdleHookDivider=(Max(1,Round(#ParallaxIdleHookMs#/#VisualizerTickMs#)))
ParallaxPausedX=(#VisualizerPlotX#+#VisualizerPlotWidth#/2)
ParallaxPausedY=(#Inset#+(#VisualizerPlotTop#+#VisualizerPlotHeight#/2)*#Scale#)
ParallaxPausedW=(#VisualizerPlotWidth#-8*#Scale#)
ParallaxPausedH=(18*#Scale#)
ParallaxPausedAlign=CenterCenter

; Event-only: Announce() and Closing() above; no update work.
[MeasureVisualizerCompanion]
Measure=Script
ScriptFile=#@#Modules\Visualizer\Companion.lua
UpdateDivider=-1

; Automatic update check (Global Settings > Updates). Daily (UpdateCheck=1)
; loads the background check (@Resources\Update\Hook1.inc); Off loads a
; comment-only file.
[ParallaxUpdateHookInclude]
@Include98=#@#Update\Hook#UpdateCheck#.inc

; Idle stand-down hook, last so its "Paused (idle)" line draws on top. Off
; (IdlePauseMinutes=0) loads a comment-only file (@Resources\Idle\Hook0.inc).
[ParallaxIdleHookInclude]
@Include99=#@#Idle\Hook#IdlePauseMinutes#.inc
