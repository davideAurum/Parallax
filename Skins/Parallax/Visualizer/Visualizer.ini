[Rainmeter]
; Only this config uses the visualizer cadence. Capture settings apply on refresh.
Update=#VisualizerEffectiveInterval#
AccurateText=1
DynamicWindowSize=1
Group=Parallax
ContextTitle=Parallax settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]
ContextTitle2=Visualizer options
ContextAction2=["notepad.exe" "#@#User\Visualizer.inc"]
ContextTitle3=Standard width
ContextAction3=[!WriteKeyValue Variables Columns 1 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle4=Double width
ContextAction4=[!WriteKeyValue Variables Columns 2 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle5=Quality: economy (512 FFT)
ContextAction5=[!WriteKeyValue Variables VisualizerQuality 0 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle6=Quality: balanced (1024 FFT)
ContextAction6=[!WriteKeyValue Variables VisualizerQuality 1 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle7=Quality: detailed (2048 FFT)
ContextAction7=[!WriteKeyValue Variables VisualizerQuality 2 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle8=Cadence: follow suite setting
ContextAction8=[!WriteKeyValue Variables VisualizerUpdateOverride 0 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle9=Cadence: 33 ms (about 30 FPS)
ContextAction9=[!WriteKeyValue Variables VisualizerUpdateOverride 33 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle10=Cadence: 50 ms (20 FPS)
ContextAction10=[!WriteKeyValue Variables VisualizerUpdateOverride 50 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle11=Cadence: 100 ms (10 FPS)
ContextAction11=[!WriteKeyValue Variables VisualizerUpdateOverride 100 "#@#User\Visualizer.inc"][!Refresh]
ContextTitle12=Reconnect output device
ContextAction12=[!Refresh]
ContextTitle13=Stop capture / unload Visualizer
ContextAction13=[!DeactivateConfig]

[Metadata]
Name=Parallax Visualizer
Author=Parallax contributors
Information=Output-device spectrum using Rainmeter AudioLevel. Mixed output audio; no audio processing.
Version=0.1.0

[Variables]
@Include1=#@#Defaults.inc
@Include2=#@#User\Settings.inc
@Include3=#@#User\Visualizer.inc
@Include4=#@#Geometry.inc
@Include5=#@#Styles.inc
@Include6=#@#Modules\Visualizer\Config.inc
@Include7=#@#Modules\Visualizer\Audio.inc
@Include8=#@#Modules\Visualizer\View.inc
