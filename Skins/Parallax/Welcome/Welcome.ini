[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Group=Parallax
; Load state is re-read only on explicit events: skin load, suite refresh and
; entering the panel. Nothing here polls Rainmeter or the file system.
OnRefreshAction=[!CommandMeasure MeasureWelcome "Render()"]
MouseOverAction=[!CommandMeasure MeasureWelcome "Render()"]
ContextTitle=Global settings
ContextAction=[!ActivateConfig "Parallax\Settings" "Settings.ini"]

[Metadata]
Name=Parallax Welcome
Author=Parallax
Information=Suite loader shown after installation. Each check box loads or unloads one Parallax component; Load all loads every one. Loaded state is read from Rainmeter's own settings file.
Version=0.1.0-dev

[Variables]
@Include=#@#Defaults.inc
@Include2=#@#User\Settings.inc
Columns=2
PanelHeight=400
@Include3=#@#Geometry.inc
@Include4=#@#Styles.inc

; Load state comes from Rainmeter's own settings file, located through the
; built-in #SETTINGSPATH# the controller reads directly.
[MeasureWelcome]
Measure=Script
ScriptFile=#@#Modules\Welcome\Welcome.lua

[MeterBounds]
Meter=Image
MeterStyle=StyleBounds

[MeterPanel]
Meter=Shape
MeterStyle=StylePanel

[MeterIcon]
Meter=Shape
X=#ContentX#
Y=(#TitleRowCenterY#-#TitleIconSize#/2)
W=#TitleIconSize#
H=#TitleIconSize#
Shape=Rectangle 0,(0.5*#TitleIconScale#),(14*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor# | StrokeWidth 0
Shape2=Rectangle 0,(5.5*#TitleIconScale#),(10*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor2# | StrokeWidth 0
Shape3=Rectangle 0,(10.5*#TitleIconScale#),(14*#TitleIconScale#),(3*#TitleIconScale#) | Fill Color #AccentColor# | StrokeWidth 0
AntiAlias=1
UpdateDivider=-1

[MeterTitle]
Meter=String
MeterStyle=StyleTitle|StyleTitleRow
X=(#ContentX#+#TitleIconSize#+#TitleIconGap#)
W=(#ContentWidth#-#TitleIconSize#-#TitleIconGap#-26*#Scale#)
Text=Welcome to Parallax

[MeterClose]
Meter=String
MeterStyle=StyleButton
X=(#ContentX#+#ContentWidth#)
Y=#TitleRowCenterY#
W=(18*#Scale#)
H=(18*#Scale#)
FontSize=(#FontSize#*#Scale#)
StringAlign=RightCenter
Padding=0,0,0,0
Text=X
LeftMouseUpAction=[!DeactivateConfig]
ToolTipText=Close this panel. Loaded utilities keep running. Reopen it from the Global Settings right-click menu, or from Manage Rainmeter under Parallax\Welcome.

[MeterIntro]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+34*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
FontColor=#TextColor#
Text=Parallax is installed. Choose the utilities you want on the desktop.
UpdateDivider=-1

[MeterIntroDetail]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+50*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
FontColor=#MutedColor#
Text=Check a box to load that utility; clear it to unload. Rainmeter remembers.
UpdateDivider=-1

[MeterComponentsSection]
Meter=String
MeterStyle=StyleHeader
FontColor=#AccentColor#
Y=(#Inset#+76*#Scale#)
Text=Components
UpdateDivider=-1

[MeterComponentsRule]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+96*#Scale#)

[MeterSettingsDivider]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+300*#Scale#)

[WelcomeRowInclude]
@Include5=#@#Modules\Welcome\Rows.inc

[MeterActionsRule]
Meter=Shape
MeterStyle=StyleRule
Y=(#Inset#+338*#Scale#)

[MeterLoadAll]
Meter=String
MeterStyle=StyleButton
X=#ContentX#
Y=(#Inset#+348*#Scale#)
W=(72*#Scale#)
SolidColor=#TrackColor#
Text=Load all
LeftMouseUpAction=[!CommandMeasure MeasureWelcome "LoadAll()"]
ToolTipText=Load every component listed above, including Global Settings.

[MeterUnloadAll]
Meter=String
MeterStyle=StyleButton|StyleSecondaryButton
X=(#ContentX#+82*#Scale#)
Y=(#Inset#+348*#Scale#)
W=(72*#Scale#)
Text=Unload all
LeftMouseUpAction=[!CommandMeasure MeasureWelcome "UnloadAll()"]
ToolTipText=Unload every component listed above. This panel stays open.

[MeterWelcomeStatus]
Meter=String
MeterStyle=StyleLabel
Y=(#Inset#+374*#Scale#)
FontSize=((#FontSize#-1)*#Scale#)
FontColor=#MutedColor#
Text=Reading loaded components...
UpdateDivider=-1
